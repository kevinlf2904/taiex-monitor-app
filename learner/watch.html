<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K線看盤</title>
<meta name="description" content="自選股即時報價、盤中分 K、日 K 技術指標與五檔，和 K線學堂共用資料與圖表。">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="watch.webmanifest">
<link rel="apple-touch-icon" href="watch-icon-180.png">
<link rel="icon" href="watch-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K線看盤">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("kline:theme") || '"dark"'); } catch { document.documentElement.dataset.theme = "dark"; }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="core.css">
<style>
/* 看盤：左邊自選股清單、右邊個股（手機上清單和個股輪流顯示）。主題色與 K 線圖樣式在 core.css。 */
body { padding-bottom: env(safe-area-inset-bottom, 0px); line-height: 1.5; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.note { font-size: 12.5px; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface-2); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 700; }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface-2); padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 700; }
.ibar { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.ibar-g { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ibar-t { font-size: 12px; color: var(--muted); letter-spacing: .06em; margin-right: 2px; }
.ichip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; }
.ichip i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
.ichip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
input.code { padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-3); color: var(--ink); font-family: var(--font-mono); font-size: 16px; min-width: 0; }
input[type="number"] { padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-3); color: var(--ink); font-family: var(--font-mono); font-size: 15px; width: 120px; }

.w-top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 900; font-size: 19px; color: var(--ink); text-decoration: none; }
.brand b { width: 28px; height: 28px; border-radius: 7px; background: var(--up); color: #fff; display: grid; place-items: center; font-size: 15px; }
.ix { display: flex; gap: 8px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.ixc { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; }
.ixc b { font-family: var(--font-mono); font-size: 14px; }
.ixc .num { font-size: 12.5px; }
.tools { display: flex; align-items: center; gap: 8px; }
.stat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.on { background: var(--up); box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 25%, transparent); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px transparent; } }
@media (prefers-reduced-motion: reduce) { .dot.on { animation: none; } }
.icon-btn { width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
:root[data-theme="dark"] .ic-moon, :root:not([data-theme="dark"]) .ic-sun { display: none; }

.w-main { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; align-items: start; }
.w-list { position: sticky; top: 76px; max-height: calc(100vh - 92px); display: flex; flex-direction: column; overflow: hidden; }
.w-list form { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
.w-list form input { flex: 1; }
.w-sort { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.wl { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
.wl li { border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 12px; align-items: center; padding: 10px 12px; cursor: pointer; width: 100%; border: 0; background: transparent; color: inherit; text-align: left; }
.row:hover { background: var(--surface-2); }
.row[aria-current="true"] { background: var(--accent-soft); }
.row .nm { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .cd { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: 6px; font-weight: 400; }
.row .px { font-family: var(--font-mono); font-size: 16px; font-weight: 600; text-align: right; }
.row .pc { font-family: var(--font-mono); font-size: 13px; min-width: 68px; text-align: center; padding: 2px 6px; border-radius: 6px; font-weight: 600; }
.row .pc.up { background: color-mix(in srgb, var(--up) 16%, transparent); } .row .pc.down { background: color-mix(in srgb, var(--down) 16%, transparent); }
.row .sub { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 11.5px; color: var(--muted); }
.rng { position: relative; height: 4px; border-radius: 4px; background: var(--surface-3); }
.rng i { position: absolute; top: -3px; width: 2px; height: 10px; background: var(--ink); border-radius: 1px; }
.rng u { position: absolute; top: -2px; width: 1px; height: 8px; background: var(--muted); }
.edit-ctl { display: flex; gap: 4px; }
.edit-ctl button { border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); border-radius: 6px; width: 30px; height: 28px; cursor: pointer; }
.alert-tag { color: var(--accent); margin-left: 4px; }
.empty { padding: 24px 16px; text-align: center; }

.w-detail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.d-head { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.d-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.d-title h1 { margin: 0; font-family: var(--font-display); font-size: 24px; }
.d-title .cd { font-family: var(--font-mono); color: var(--muted); }
.d-px { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.d-px b { font-family: var(--font-mono); font-size: 34px; line-height: 1.1; }
.d-px span { font-family: var(--font-mono); font-size: 16px; font-weight: 600; }
.d-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.d-kv div { background: var(--surface-2); padding: 6px 10px; }
.d-kv span { display: block; font-size: 11.5px; color: var(--muted); }
.d-kv b { font-family: var(--font-mono); font-weight: 600; font-size: 14px; }
.d-act { display: flex; gap: 8px; flex-wrap: wrap; }
.back { display: none; }
.d-alert { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.d-alert .row2 { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.d-grid { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 14px; align-items: start; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.ph h2 { margin: 0; font-size: 15px; }
.book { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.book th { font-family: var(--font-body); font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 10px; text-align: right; }
.book td { padding: 5px 10px; text-align: right; position: relative; }
.book td.bar { padding: 0; width: 0; }
.bk-bar { position: absolute; top: 3px; bottom: 3px; opacity: .18; border-radius: 3px; }
.book-sum { padding: 8px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: calc(100vw - 32px); }
.foot { padding: 0 16px 24px; max-width: 1400px; margin: 0 auto; }

@media (max-width: 900px) {
  .w-main { grid-template-columns: minmax(0, 1fr); padding: 12px; }
  .w-list { position: static; max-height: none; }
  .w-main.show-detail .w-list { display: none; }
  .w-main:not(.show-detail) .w-detail { display: none; }
  .back { display: inline-flex; }
  .d-grid { grid-template-columns: minmax(0, 1fr); }
  .stat .st-t { display: none; }
}
@media (max-width: 480px) { .brand span { display: none; } .w-top { gap: 8px; padding-left: 12px; padding-right: 12px; } .d-px b { font-size: 28px; } }
</style>
</head>
<body>
<header class="w-top">
  <a class="brand" href="watch.html" aria-label="K線看盤"><b>K</b><span>K線看盤</span></a>
  <div class="ix" id="ix" aria-label="大盤指數"></div>
  <div class="tools">
    <span class="stat" id="stat"><i class="dot" id="dot"></i><span class="st-t" id="statText">連線中…</span></span>
    <a class="icon-btn" href="./" aria-label="回 K線學堂" title="回 K線學堂"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7a3 3 0 0 1 3 3v11a2 2 0 0 0-2-2H4zM20 5h-4a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h4z"/></svg></a>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="切換深色 / 淺色"><svg viewBox="0 0 24 24" aria-hidden="true" class="ic-moon"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="ic-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
</header>

<main class="w-main" id="main">
  <section class="w-list panel" aria-label="自選股">
    <form id="addForm"><input class="code" id="addCode" placeholder="輸入代號加入，例 2330" autocomplete="off" inputmode="search" enterkeyhint="go" aria-label="股票代號"><button class="btn primary">加入</button></form>
    <div class="w-sort">
      <div class="seg" role="group" aria-label="排序" id="sortSeg"><button data-sort="custom">自訂</button><button data-sort="chg">漲跌幅</button><button data-sort="vol">成交量</button></div>
      <button class="btn sm" id="editBtn" type="button">編輯</button>
    </div>
    <ul class="wl" id="wl"></ul>
    <p class="note" id="wlNote" style="margin:0;padding:8px 12px"></p>
  </section>

  <section class="w-detail" id="detail" aria-live="polite">
    <div class="panel d-head">
      <div class="d-title"><button class="btn sm back" id="backBtn" type="button">← 自選股</button><h1 id="dName">—</h1><span class="cd" id="dCode"></span><span class="note" id="dMarket"></span></div>
      <div class="d-px"><b id="dPx">—</b><span id="dChg"></span><span class="note" id="dTime"></span></div>
      <div class="d-kv" id="dKv"></div>
      <div class="d-act">
        <button class="btn sm" id="alertBtn" type="button">🔔 價格提醒</button>
        <a class="btn sm" id="learnLink" href="./">到 K線學堂判讀 ↗</a>
        <button class="btn sm" id="favBtn" type="button">加入自選</button>
      </div>
    </div>
    <div class="panel d-alert" id="alertBox" hidden>
      <strong>價格提醒</strong>
      <div class="row2"><label>漲到 ≥ <input type="number" step="any" id="alUp" inputmode="decimal"></label><label>跌到 ≤ <input type="number" step="any" id="alDn" inputmode="decimal"></label></div>
      <div class="row2"><button class="btn primary sm" id="alSave" type="button">儲存提醒</button><button class="btn sm" id="alClear" type="button">清除</button><span class="note" id="alNote"></span></div>
      <p class="note" style="margin:0">提醒只在這個頁面開著時會觸發（盤中每 10 秒檢查一次），觸發後會跳出通知並自動關閉，要再提醒請重新儲存。iPhone 要先把這個頁面「加入主畫面」，從主畫面打開才收得到系統通知。</p>
    </div>
    <div class="d-grid">
      <div class="panel">
        <div class="ph"><h2>盤中分 K</h2><div class="seg" role="group" aria-label="分 K 週期" id="tfSeg"><button data-tf="1">1分</button><button data-tf="5">5分</button><button data-tf="15">15分</button><button data-tf="60">60分</button></div><span class="note" id="intraNote"></span></div>
        <div class="chartbox" id="intraChart"></div>
      </div>
      <div class="panel">
        <div class="ph"><h2>五檔</h2><span class="note" id="bookNote"></span></div>
        <div id="book"></div>
      </div>
    </div>
    <div class="panel">
      <div class="ph"><h2>日 K</h2><div class="seg" role="group" aria-label="日 K 期間" id="monSeg"><button data-m="3">3月</button><button data-m="6">6月</button><button data-m="12">1年</button><button data-m="24">2年</button></div><span class="note" id="dailyNote"></span></div>
      <div class="ibar" id="dIbar"></div>
      <div class="chartbox" id="dailyChart"></div>
    </div>
  </section>
</main>
<p class="note foot">報價：證交所 MIS 即時快照（約 5 秒一筆）；設定富果 API 金鑰時，個股與分 K 改用富果。不是逐筆即時、不能下單，僅供學習與參考，不構成投資建議。手機可用瀏覽器的「加入主畫面」，當成 App 使用。</p>
<div id="toast" role="status" hidden></div>

<script src="core.js"></script>
<script>
"use strict";
/* ---------- 狀態（記在瀏覽器；和 K線學堂同一個網域時共用主題設定） ---------- */
const W = {
  list: store.get("watch:list", ["2330", "2317", "2454", "0050", "2603", "2881"]),
  names: store.get("watch:names", {}),
  sort: store.get("watch:sort", "custom"),
  alerts: store.get("watch:alerts", {}),
  tf: [1, 5, 15, 60].includes(+store.get("watch:tf", 5)) ? +store.get("watch:tf", 5) : 5,
  months: [3, 6, 12, 24].includes(+store.get("watch:months", 6)) ? +store.get("watch:months", 6) : 6,
  editing: false, sel: null, quotes: new Map(), detailQ: null, session: null, today: new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10), err: null, off: !/^https?:$/.test(location.protocol),
  daily: null, intra: null, intraAt: 0, timer: null, busy: false,
};
const saveList = () => { store.set("watch:list", W.list); store.set("watch:names", W.names); };
const okCode = c => /^\d{4,6}[A-Z]?$/.test(c);
const cls = v => (v > 0 ? "up" : v < 0 ? "down" : "");
const arrow = v => (v > 0 ? "▲" : v < 0 ? "▼" : "");
const fmtVol = v => (v == null ? "—" : v >= 1e4 ? (v / 1e4).toFixed(1) + " 萬" : v.toLocaleString());
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function mktSession(now = new Date()) {
  const t = new Date(now.getTime() + 8 * 3600e3), day = t.getUTCDay(), m = t.getUTCHours() * 60 + t.getUTCMinutes();
  if (day === 0 || day === 6) return "closed";
  return m >= 510 && m < 540 ? "pre" : m >= 540 && m <= 815 ? "open" : "closed";
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 5000); }

/* ---------- 資料 ---------- */
async function getJ(url) {
  const r = await fetch(url), j = await r.json().catch(() => null);
  if (!j) { if (r.status === 404) W.off = true; throw new Error(r.status === 404 ? "這個環境沒有報價服務，部署到網站後才能用" : `服務回應 ${r.status}`); }
  if (!j.ok) throw new Error(j.error || "拿不到資料");
  return j;
}
// 自選股與指數：一次批次查（只用 MIS，不消耗富果額度）
async function pollList() {
  const codes = ["T00", "O00", ...W.list];
  const j = await getJ(`/api/quote?codes=${codes.join(",")}&src=mis`);
  W.session = j.session; W.today = j.today;
  j.quotes.forEach(q => { W.quotes.set(q.code, q); if (q.name && okCode(q.code)) W.names[q.code] = q.name; });
  saveList();
}
// 正在看的那一檔：用預設來源（有富果金鑰時是富果）
async function pollDetail() {
  if (!W.sel) return;
  const j = await getJ(`/api/quote?codes=${W.sel}`), q = j.quotes.find(x => x.code === W.sel);
  if (q) { W.detailQ = q; W.detailSrc = j.source; if (q.name) W.names[q.code] = q.name; mergeDaily(q); }
}
async function tick() {
  if (W.off || W.busy || document.visibilityState === "hidden") return;
  W.busy = true;
  try { await Promise.all([pollList(), pollDetail()]); W.err = null; checkAlerts(); }
  catch (e) { W.err = e.message; }
  finally { W.busy = false; renderAll(); loadIntra(); }
}
function schedule() { clearTimeout(W.timer); if (W.off) return; W.timer = setTimeout(async () => { await tick(); schedule(); }, mktSession() === "closed" ? 300000 : 10000); }
const kick = () => tick().then(schedule);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") kick(); });

/* ---------- 頂部：指數與連線狀態 ---------- */
function renderTop() {
  $("#ix").innerHTML = ["T00", "O00"].map(c => { const q = W.quotes.get(c); if (!q) return ""; return `<span class="ixc">${c === "T00" ? "加權" : "櫃買"}<b>${q.price != null ? q.price.toLocaleString(undefined, { maximumFractionDigits: 2 }) : "—"}</b><span class="num ${cls(q.chg)}">${arrow(q.chg)}${q.chg != null ? Math.abs(q.chg).toFixed(2) : ""} ${q.chgPct != null ? "(" + (q.chgPct > 0 ? "+" : "") + q.chgPct + "%)" : ""}</span></span>`; }).join("");
  const on = !W.off && !W.err && W.session && W.session !== "closed";
  $("#dot").className = "dot" + (on ? " on" : "");
  $("#statText").textContent = W.off ? "離線（需部署）" : W.err ? "連線異常" : W.session === "pre" ? "試撮中" : W.session === "open" ? "盤中即時" : W.session ? "收盤" : "連線中…";
  $("#stat").title = W.err || "";
}

/* ---------- 自選股清單 ---------- */
function sorted() {
  const L = W.list.map(c => ({ c, q: W.quotes.get(c) }));
  if (W.sort === "chg") L.sort((a, b) => (b.q?.chgPct ?? -1e9) - (a.q?.chgPct ?? -1e9));
  else if (W.sort === "vol") L.sort((a, b) => (b.q?.vol ?? -1) - (a.q?.vol ?? -1));
  return L;
}
function renderList() {
  document.querySelectorAll("#sortSeg [data-sort]").forEach(b => b.setAttribute("aria-pressed", b.dataset.sort === W.sort));
  $("#editBtn").textContent = W.editing ? "完成" : "編輯";
  const L = W.editing ? W.list.map(c => ({ c, q: W.quotes.get(c) })) : sorted();
  $("#wl").innerHTML = L.length ? L.map(({ c, q }, k) => {
    const nm = esc(q?.name || W.names[c] || c), al = W.alerts[c] && (W.alerts[c].up || W.alerts[c].dn);
    if (W.editing) return `<li><div class="row" style="cursor:default"><span class="nm">${nm}<span class="cd">${c}</span></span><span class="edit-ctl"><button data-mv="${k}" data-d="-1" aria-label="上移 ${nm}" ${k ? "" : "disabled"}>↑</button><button data-mv="${k}" data-d="1" aria-label="下移 ${nm}" ${k < L.length - 1 ? "" : "disabled"}>↓</button><button data-rm="${c}" aria-label="移除 ${nm}">✕</button></span></div></li>`;
    const lo = q?.low, hi = q?.high, rng = lo != null && hi != null && hi > lo, pos = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
    return `<li><button class="row" data-sel="${c}" aria-current="${c === W.sel}">
      <span class="nm">${nm}<span class="cd">${c}</span>${al ? '<span class="alert-tag" title="已設定價格提醒">🔔</span>' : ""}</span>
      <span class="px ${cls(q?.chg)}">${q?.price != null ? fmtP(q.price) : "—"}</span>
      <span class="pc ${cls(q?.chg)}">${q?.chgPct != null ? (q.chgPct > 0 ? "+" : "") + q.chgPct.toFixed(2) + "%" : "—"}</span>
      <span class="sub"><span class="rng" title="今日最低 ${lo ?? "—"} ～ 最高 ${hi ?? "—"}">${rng ? `${q.prev ? `<u style="left:${pos(q.prev)}%"></u>` : ""}<i style="left:calc(${pos(q.price)}% - 1px)"></i>` : ""}</span><span>量 ${fmtVol(q?.vol)}</span></span>
    </button></li>`;
  }).join("") : `<li class="empty note">還沒有自選股。在上面輸入代號加入。</li>`;
  $("#wlNote").textContent = `${W.list.length} / 30 檔・${W.off ? "需要部署到網站才有報價" : "盤中每 10 秒更新"}`;
}
$("#wl").addEventListener("click", e => {
  const s = e.target.closest("[data-sel]"), mv = e.target.closest("[data-mv]"), rm = e.target.closest("[data-rm]");
  if (s) select(s.dataset.sel);
  else if (mv) { const k = +mv.dataset.mv, d = +mv.dataset.d; [W.list[k], W.list[k + d]] = [W.list[k + d], W.list[k]]; saveList(); renderList(); }
  else if (rm) { W.list = W.list.filter(c => c !== rm.dataset.rm); saveList(); renderList(); renderDetailHead(); }
});
$("#addForm").addEventListener("submit", e => {
  e.preventDefault(); const c = $("#addCode").value.trim().toUpperCase();
  if (!okCode(c)) { toast("請輸入 4 到 6 碼的股票代號，例如 2330、0050、00878"); return; }
  if (!W.list.includes(c)) { if (W.list.length >= 30) { toast("自選股最多 30 檔"); return; } W.list.push(c); saveList(); }
  $("#addCode").value = ""; select(c); kick();
});
$("#sortSeg").addEventListener("click", e => { const b = e.target.closest("[data-sort]"); if (!b) return; W.sort = b.dataset.sort; store.set("watch:sort", W.sort); renderList(); });
$("#editBtn").addEventListener("click", () => { W.editing = !W.editing; renderList(); });

/* ---------- 個股 ---------- */
const intraChart = new Chart($("#intraChart"));
const dailyChart = new Chart($("#dailyChart"));
const dBar = indicatorBar($("#dIbar"), "watch", [{ title: "主圖", items: MAIN_ITEMS }, { title: "副圖", items: SUB_ITEMS }], ["ma5", "ma20", "ma60", "vol", "kd"], () => drawDaily());
function select(code, push = true) {
  if (!okCode(code)) return;
  W.sel = code; W.detailQ = W.quotes.get(code) || null; W.daily = null; W.intra = null; W.intraAt = 0;
  if (push) try { history.replaceState(null, "", "#" + code); } catch {}
  $("#main").classList.add("show-detail");
  renderList(); renderDetailHead(); renderBook(); loadDaily(); loadIntra(true); pollDetail().then(renderDetailHead).catch(() => {});
  $("#learnLink").href = `./?code=${code}#shot`;
  if (matchMedia("(max-width: 900px)").matches) window.scrollTo({ top: 0 });
}
$("#backBtn").addEventListener("click", () => { $("#main").classList.remove("show-detail"); try { history.replaceState(null, "", location.pathname); } catch {} });
function renderDetailHead() {
  const c = W.sel; if (!c) return;
  const q = W.detailQ || W.quotes.get(c), nm = q?.name || W.names[c] || c;
  document.title = `${nm} ${q?.price != null ? fmtP(q.price) : ""}｜K線看盤`;
  $("#dName").textContent = nm; $("#dCode").textContent = c; $("#dMarket").textContent = q?.market || "";
  $("#dPx").textContent = q?.price != null ? fmtP(q.price) : "—"; $("#dPx").className = cls(q?.chg);
  $("#dChg").textContent = q?.chg != null ? `${arrow(q.chg)}${fmtP(Math.abs(q.chg))}（${q.chgPct > 0 ? "+" : ""}${q.chgPct}%）` : ""; $("#dChg").className = cls(q?.chg);
  $("#dTime").textContent = q?.time ? `${q.date && q.date !== W.today ? q.date.replace(/-/g, "/") + " " : ""}${q.time}${q.estimated ? "（最近沒有成交，用買賣價中間估）" : ""}・${W.detailSrc || "證交所 MIS"}` : W.off ? "需要部署到網站才有報價" : "";
  const kv = [["開盤", q?.open], ["最高", q?.high], ["最低", q?.low], ["昨收", q?.prev]].map(([k, v]) => `<div><span>${k}</span><b class="${v != null && q?.prev ? cls(v - q.prev) : ""}">${v != null ? fmtP(v) : "—"}</b></div>`).join("")
    + `<div><span>成交量</span><b>${fmtVol(q?.vol)}${q?.vol != null ? " 張" : ""}</b></div>` + (q?.high && q?.low && q?.prev ? `<div><span>振幅</span><b>${((q.high - q.low) / q.prev * 100).toFixed(2)}%</b></div>` : "");
  $("#dKv").innerHTML = kv;
  const fav = W.list.includes(c); $("#favBtn").textContent = fav ? "移出自選" : "加入自選";
  const a = W.alerts[c] || {}; $("#alUp").value = a.up ?? ""; $("#alDn").value = a.dn ?? "";
  $("#alertBtn").textContent = a.up || a.dn ? `🔔 提醒：${[a.up ? "≥" + a.up : "", a.dn ? "≤" + a.dn : ""].filter(Boolean).join("、")}` : "🔔 價格提醒";
  renderBook();
}
$("#favBtn").addEventListener("click", () => { const c = W.sel; if (!c) return; if (W.list.includes(c)) W.list = W.list.filter(x => x !== c); else if (W.list.length < 30) W.list.push(c); saveList(); renderList(); renderDetailHead(); });
function renderBook() {
  const q = W.detailQ || W.quotes.get(W.sel), B = q?.bids || [], A = q?.asks || [];
  if (!B.length && !A.length) { $("#book").innerHTML = `<p class="note" style="margin:0;padding:12px">${W.off ? "需要部署到網站才有五檔。" : "目前沒有五檔資料（收盤後或試撮前）。"}</p>`; $("#bookNote").textContent = ""; return; }
  const mx = Math.max(1, ...B.map(x => x.v || 0), ...A.map(x => x.v || 0)), sb = B.reduce((s, x) => s + (x.v || 0), 0), sa = A.reduce((s, x) => s + (x.v || 0), 0);
  const rows = [...A.slice().reverse().map(x => `<tr><td></td><td class="down">${fmtP(x.p)}</td><td style="position:relative">${(x.v || 0).toLocaleString()}<span class="bk-bar" style="right:0;width:${x.v / mx * 100}%;background:var(--down)"></span></td></tr>`),
    ...B.map(x => `<tr><td style="position:relative">${(x.v || 0).toLocaleString()}<span class="bk-bar" style="left:0;width:${x.v / mx * 100}%;background:var(--up)"></span></td><td class="up">${fmtP(x.p)}</td><td></td></tr>`)];
  $("#book").innerHTML = `<table class="book"><thead><tr><th>委買量</th><th>價格</th><th>委賣量</th></tr></thead><tbody>${rows.join("")}</tbody></table><div class="book-sum">五檔委買 ${sb.toLocaleString()} 張・委賣 ${sa.toLocaleString()} 張（買賣比 ${sa ? (sb / sa).toFixed(2) : "—"}）</div>`;
  $("#bookNote").textContent = q?.time || "";
}

// 日 K：/api/kline，盤中用即時報價更新今天這根
async function loadDaily() {
  const c = W.sel; if (!c || W.off) { $("#dailyNote").textContent = W.off ? "需要部署到網站" : ""; return; }
  document.querySelectorAll("#monSeg [data-m]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.m === W.months));
  $("#dailyNote").textContent = "載入中…";
  try {
    const r = await fetch(`/api/kline?code=${c}&months=${W.months}`), j = await r.json().catch(() => null);
    if (!j) throw new Error(r.status === 404 ? "這個環境沒有日 K 服務" : `日 K 服務回應 ${r.status}`); if (!j.ok) throw new Error(j.error);
    if (W.sel !== c) return;
    W.daily = { ...j, data: j.data.map(x => ({ ...x, v: x.v || 0 })) }; if (W.detailQ) mergeDaily(W.detailQ, false);
    $("#dailyNote").textContent = `${j.data.length} 個交易日・${j.source}`; drawDaily(true);
  } catch (e) { $("#dailyNote").textContent = e.message; }
}
function mergeDaily(q, redraw = true) {
  const R = W.daily; if (!R || q.code !== W.sel || q.price == null || q.open == null || !q.date) return;
  const D = R.data, last = D[D.length - 1]; if (q.date < last.d) return;
  const bar = { d: q.date, o: q.open, h: Math.max(q.high ?? q.price, q.price), l: Math.min(q.low ?? q.price, q.price), c: q.price, v: q.vol ?? (last.d === q.date ? last.v : 0) };
  if (last.d === q.date) D[D.length - 1] = { ...last, ...bar }; else D.push(bar);
  if (redraw) drawDaily();
}
function drawDaily(fresh = false) {
  const R = W.daily; if (!R) return;
  Chart.keepView = !fresh;
  try { dailyChart.set(R.data, { ma: maFrom(dBar), boll: dBar.has("boll"), subs: subsFrom(dBar), noVol: !dBar.has("vol"), volLabel: "量（張）" }); }
  finally { Chart.keepView = false; }
}
$("#monSeg").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (!b) return; W.months = +b.dataset.m; store.set("watch:months", W.months); loadDaily(); });

// 盤中分 K：/api/intraday（盤中每 30 秒）
async function loadIntra(force = false) {
  const c = W.sel; if (!c || W.off) { $("#intraNote").textContent = W.off ? "需要部署到網站" : ""; return; }
  document.querySelectorAll("#tfSeg [data-tf]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.tf === W.tf));
  const age = Date.now() - W.intraAt; if (!force && W.intra && (mktSession() === "closed" ? age < 600000 : age < 30000)) return;
  W.intraAt = Date.now();
  try {
    const r = await fetch(`/api/intraday?code=${c}&tf=${W.tf}`), j = await r.json().catch(() => null);
    if (!j) throw new Error(r.status === 404 ? "這個環境沒有分 K 服務" : `分 K 服務回應 ${r.status}`); if (!j.ok) throw new Error(j.error);
    if (W.sel !== c) return;
    const same = W.intra && W.intra.tf === j.tf && W.intra.code === j.code; W.intra = j;
    if (!j.bars.length) { $("#intraNote").textContent = "今天還沒有分 K（開盤後才有）"; return; }
    $("#intraNote").textContent = `${j.date && j.date !== W.today ? "最近交易日 " + j.date.replace(/-/g, "/") + "・" : ""}${j.source}`;
    Chart.keepView = !!same;
    try { intraChart.set(j.bars.map(b => ({ d: b.t, o: b.o, h: b.h, l: b.l, c: b.c, v: b.v })), { ma: [5, 20], subs: ["kd"], noVol: !j.bars.some(b => b.v), volLabel: "量（張）", fmtD: s => s, hlines: j.prev ? [{ price: j.prev, label: `昨收 ${fmtP(j.prev)}`, color: "muted" }] : [] }); }
    finally { Chart.keepView = false; }
  } catch (e) { $("#intraNote").textContent = e.message; }
}
$("#tfSeg").addEventListener("click", e => { const b = e.target.closest("[data-tf]"); if (!b) return; W.tf = +b.dataset.tf; store.set("watch:tf", W.tf); loadIntra(true); });

/* ---------- 價格提醒 ---------- */
$("#alertBtn").addEventListener("click", () => { $("#alertBox").hidden = !$("#alertBox").hidden; });
$("#alSave").addEventListener("click", async () => {
  const c = W.sel, up = parseFloat($("#alUp").value), dn = parseFloat($("#alDn").value);
  if (!(up > 0) && !(dn > 0)) { $("#alNote").textContent = "請至少填一個價格"; return; }
  W.alerts[c] = { up: up > 0 ? up : null, dn: dn > 0 ? dn : null }; store.set("watch:alerts", W.alerts);
  let perm = "unsupported"; try { if ("Notification" in window) perm = Notification.permission === "default" ? await Notification.requestPermission() : Notification.permission; } catch {}
  $("#alNote").textContent = perm === "granted" ? "已儲存，觸發時會跳出系統通知" : "已儲存；這個瀏覽器沒有開通知權限，觸發時只會在頁面上提示";
  renderDetailHead(); renderList(); checkAlerts();
});
$("#alClear").addEventListener("click", () => { delete W.alerts[W.sel]; store.set("watch:alerts", W.alerts); $("#alNote").textContent = "已清除"; renderDetailHead(); renderList(); });
function notify(title, body) {
  toast(`${title}：${body}`); try { navigator.vibrate?.([120, 60, 120]); } catch {}
  try { if ("Notification" in window && Notification.permission === "granted") new Notification(title, { body, tag: title }); } catch {}
}
function checkAlerts() {
  let changed = false;
  Object.entries(W.alerts).forEach(([c, a]) => {
    const q = c === W.sel && W.detailQ ? W.detailQ : W.quotes.get(c); if (!q || q.price == null || q.estimated) return;
    const nm = q.name || W.names[c] || c;
    if (a.up && q.price >= a.up) { notify(`${nm} ${c} 漲到 ${fmtP(q.price)}`, `已達提醒價 ≥ ${a.up}`); a.up = null; changed = true; }
    if (a.dn && q.price <= a.dn) { notify(`${nm} ${c} 跌到 ${fmtP(q.price)}`, `已達提醒價 ≤ ${a.dn}`); a.dn = null; changed = true; }
    if (!a.up && !a.dn) delete W.alerts[c];
  });
  if (changed) { store.set("watch:alerts", W.alerts); renderDetailHead(); }
}

/* ---------- 其他 ---------- */
$("#themeBtn").addEventListener("click", () => { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; store.set("theme", t); $('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#000000" : "#dcdfe4"); Chart.all.forEach(c => c.draw()); });
function renderAll() { renderTop(); renderList(); if (W.sel) { renderDetailHead(); } }

// 起始：網址 #2330 直接開那一檔；桌機預設開清單第一檔
const h0 = location.hash.slice(1).toUpperCase();
if (okCode(h0)) select(h0, false);
else if (W.list.length && matchMedia("(min-width: 901px)").matches) select(W.list[0], false);
renderAll();
if (W.off) { $("#wlNote").textContent = "這個環境沒有報價服務；部署到網站（Vercel）後才會有即時資料。"; renderTop(); }
else kick();
</script>
</body>
</html>
