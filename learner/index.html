<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K線學堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 交易終端機的冷調紙面。頂部頁籤切換四個區塊；課程區為「目錄側欄 + 講義」，圖表一律滿版。 */
:root {
  --bg: #eceff3;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --ink: #18202b;
  --muted: #5b6676;
  --line: #d3d9e2;
  --accent: #2346a0;
  --accent-soft: #e2e8f7;
  --up: #d0343a;      /* 台股慣例：紅漲 */
  --down: #0f8655;    /* 綠跌 */
  --s1: #d98a0b;      /* 短均線 */
  --s2: #7a4fd0;      /* 中均線 */
  --s3: #0d8aa0;      /* 長均線 */
  --band: rgba(35, 70, 160, 0.07);
  --shade: rgba(24, 32, 43, 0.05);
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #161d27; --surface-2: #1b2430; --ink: #e5eaf1; --muted: #94a1b3;
    --line: #2a3443; --accent: #86a2ff; --accent-soft: #1f2a44; --up: #ff5d5d; --down: #2fc487;
    --s1: #f2a93b; --s2: #ab8cff; --s3: #3cc6d8; --band: rgba(134, 162, 255, 0.09); --shade: rgba(229, 234, 241, 0.05);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #161d27; --surface-2: #1b2430; --ink: #e5eaf1; --muted: #94a1b3;
  --line: #2a3443; --accent: #86a2ff; --accent-soft: #1f2a44; --up: #ff5d5d; --down: #2fc487;
  --s1: #f2a93b; --s2: #ab8cff; --s3: #3cc6d8; --band: rgba(134, 162, 255, 0.09); --shade: rgba(229, 234, 241, 0.05);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.7;
}
[hidden] { display: none !important; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }

/* ---------- header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-inner {
  max-width: 1180px; margin: 0 auto; padding: 10px 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.seal {
  width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center;
  background: var(--up); color: #fff; font-family: var(--font-display); font-weight: 900; font-size: 19px;
}
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 21px; letter-spacing: 0.04em; line-height: 1.1; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); letter-spacing: 0.05em; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; overflow-x: auto; max-width: 100%; }
.tabs button {
  border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; cursor: pointer;
  font-size: 14px; color: var(--muted); white-space: nowrap;
}
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
  border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); background: var(--surface);
}

main { max-width: 1180px; margin: 0 auto; padding: 22px 16px 40px; }
h2 { font-family: var(--font-display); font-weight: 900; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
h3 { font-size: 16px; margin: 0 0 6px; }
.eyebrow { font-size: 12px; letter-spacing: 0.12em; color: var(--accent); font-weight: 700; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer;
  font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 700; }
.btn.big { padding: 10px 22px; font-size: 16px; font-weight: 700; }
.btn.buy { background: var(--up); border-color: var(--up); color: #fff; }
.btn.sell { background: var(--down); border-color: var(--down); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- chart ---------- */
.chartbox { position: relative; }
.legend {
  display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; min-height: 40px;
  padding: 8px 12px; border-bottom: 1px solid var(--line); line-height: 1.6;
}
.legend b { font-weight: 600; color: var(--muted); margin-right: 3px; font-family: var(--font-body); }
.legend span { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chartbox canvas { display: block; width: 100%; touch-action: pan-y; cursor: crosshair; }

/* ---------- learn ---------- */
.learn { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
.lesson-list { position: sticky; top: 90px; display: flex; flex-direction: column; gap: 2px; }
.lesson-list button {
  text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer;
  display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 6px; font-size: 14px; color: var(--muted);
}
.lesson-list button:hover { background: var(--surface-2); color: var(--ink); }
.lesson-list button[aria-current="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: inset 0 0 0 1px var(--line); }
.lesson-list .n { font-family: var(--font-mono); font-size: 12px; }
.lesson-list .done { color: var(--up); font-size: 13px; }
.lesson { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.lesson-head { display: flex; flex-direction: column; gap: 4px; }
.prose { max-width: 68ch; }
.prose p { margin: 0 0 10px; }
.prose ul { margin: 0 0 10px; padding-left: 1.3em; }
.prose li { margin-bottom: 4px; }
.prose strong { color: var(--ink); }
.prose table { border-collapse: collapse; font-size: 14px; margin: 4px 0 12px; }
.prose th, .prose td { border-bottom: 1px solid var(--line); padding: 6px 12px 6px 0; text-align: left; vertical-align: top; }
.prose th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
.formula { font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; overflow-x: auto; white-space: pre; }
.keys { background: var(--accent-soft); border-radius: var(--radius); padding: 14px 18px; max-width: 68ch; }
.keys h3 { color: var(--accent); font-size: 13px; letter-spacing: .1em; }
.keys ul { margin: 0; padding-left: 1.2em; }
.try { display: flex; gap: 10px; align-items: baseline; font-size: 14px; color: var(--muted); padding: 0 4px; }
.try b { color: var(--accent); white-space: nowrap; }
.lesson-nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.anatomy { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; }
.anatomy svg { max-width: 100%; height: auto; }
.anatomy text { font-size: 12px; fill: var(--muted); font-family: var(--font-body); }
.anatomy .lbl-strong { fill: var(--ink); font-weight: 700; }
.anatomy .guide { stroke: var(--line); stroke-dasharray: 3 3; }

/* ---------- lab ---------- */
.lab { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.lab-side { display: flex; flex-direction: column; gap: 14px; }
.ctrl { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.ctrl h3 { font-size: 12.5px; letter-spacing: .1em; color: var(--muted); margin: 0; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
input[type="number"] { width: 62px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); font-family: var(--font-mono); font-size: 13px; }
select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); font-size: 14px; max-width: 100%; }
.readout { display: flex; flex-direction: column; gap: 6px; }
.ro { display: grid; grid-template-columns: 58px 1fr auto; gap: 8px; align-items: baseline; font-size: 13.5px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.ro:last-child { border-bottom: 0; }
.ro .k { color: var(--muted); font-size: 12.5px; }
.pill { font-size: 11.5px; padding: 0 8px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
.pill.bull { background: color-mix(in srgb, var(--up) 15%, transparent); color: var(--up); }
.pill.bear { background: color-mix(in srgb, var(--down) 15%, transparent); color: var(--down); }
.pill.flat { background: var(--surface-2); color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 1px; background: var(--line); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.stat { background: var(--surface); padding: 10px 12px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--font-mono); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
.trades { border-collapse: collapse; width: 100%; font-size: 13px; }
.trades th, .trades td { padding: 5px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.trades th { color: var(--muted); font-weight: 500; font-size: 12px; }
.trades td:first-child, .trades th:first-child { text-align: left; }
.note { font-size: 12.5px; color: var(--muted); }
.bt { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* ---------- challenge ---------- */
.chal-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
.score { display: flex; gap: 18px; }
.score div { text-align: right; }
.score .k { font-size: 12px; color: var(--muted); }
.score .v { font-family: var(--font-mono); font-size: 22px; font-weight: 600; }
.chal-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.verdict { padding: 14px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.verdict .big { font-family: var(--font-display); font-size: 22px; font-weight: 900; }
.grid-ro { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 24px; }

/* ---------- quiz ---------- */
.quiz { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.qcard { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.qmeta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.qbar { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.qbar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.qtext { font-size: 19px; font-weight: 700; line-height: 1.5; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opts button {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; cursor: pointer;
  display: grid; grid-template-columns: 24px 1fr; gap: 8px; font-size: 15px;
}
.opts button:hover:not(:disabled) { border-color: var(--accent); }
.opts button .l { font-family: var(--font-mono); color: var(--muted); }
.opts button.right { border-color: var(--down); background: color-mix(in srgb, var(--down) 10%, var(--surface)); }
.opts button.wrong { border-color: var(--up); background: color-mix(in srgb, var(--up) 10%, var(--surface)); }
.opts button:disabled { cursor: default; color: var(--ink); }
.explain { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; font-size: 14.5px; }

footer { max-width: 1180px; margin: 0 auto; padding: 0 16px 32px; font-size: 12.5px; color: var(--muted); }

@media (max-width: 900px) {
  .learn { grid-template-columns: minmax(0, 1fr); }
  .lesson-list { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .lesson-list button { grid-template-columns: auto auto auto; white-space: nowrap; }
  .lab { grid-template-columns: minmax(0, 1fr); }
  .top { position: static; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="seal" aria-hidden="true">K</div>
      <div><h1>K線學堂</h1><p>台股技術分析互動練習</p></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="主要區塊">
      <button role="tab" data-tab="learn" id="tab-btn-learn">課程</button>
      <button role="tab" data-tab="lab" id="tab-btn-lab">圖表實驗室</button>
      <button role="tab" data-tab="challenge" id="tab-btn-challenge">判讀挑戰</button>
      <button role="tab" data-tab="quiz" id="tab-btn-quiz">觀念測驗</button>
    </nav>
    <span class="chip" id="progChip">已完成 0 / 9 課</span>
  </div>
</header>

<main>
  <!-- 課程 -->
  <section id="view-learn" class="learn" role="tabpanel">
    <nav class="lesson-list" id="lessonList" aria-label="課程目錄"></nav>
    <article class="lesson" id="lesson">
      <div class="lesson-head">
        <div class="eyebrow" id="lessonEyebrow"></div>
        <h2 id="lessonTitle"></h2>
      </div>
      <div class="prose" id="lessonBody"></div>
      <div class="panel chartbox" id="lessonChart"></div>
      <div class="try" id="lessonTry"></div>
      <div class="keys" id="lessonKeys"></div>
      <div class="lesson-nav">
        <button class="btn" id="lessonPrev">← 上一課</button>
        <button class="btn primary" id="lessonNext">完成本課，下一課 →</button>
      </div>
    </article>
  </section>

  <!-- 實驗室 -->
  <section id="view-lab" role="tabpanel" hidden>
    <div class="chal-head">
      <div><div class="eyebrow">LAB</div><h2>圖表實驗室</h2></div>
      <p class="note" style="max-width: 46ch; margin: 0">自由開關指標、調整參數，再挑一個策略看看它在這段走勢的回測成績。游標移到任一根K棒，右側會顯示那天的指標判讀。</p>
    </div>
    <div class="lab">
      <div style="display:flex; flex-direction:column; gap:18px; min-width:0">
        <div class="panel chartbox" id="labChart"></div>
        <div class="panel bt" id="btPanel"></div>
      </div>
      <div class="lab-side">
        <div class="panel ctrl">
          <h3>走勢</h3>
          <div class="row">
            <button class="btn primary" id="labNew">產生新走勢</button>
            <label>長度 <select id="labLen"><option value="120">120 天</option><option value="180" selected>180 天</option><option value="250">250 天</option></select></label>
          </div>
          <div class="note num" id="labSeed"></div>
        </div>
        <div class="panel ctrl">
          <h3>主圖疊加</h3>
          <div class="row"><label><input type="checkbox" id="maA" checked><span class="swatch" style="background:var(--s1)"></span>MA</label><input type="number" id="maAn" value="5" min="2" max="120"></div>
          <div class="row"><label><input type="checkbox" id="maB" checked><span class="swatch" style="background:var(--s2)"></span>MA</label><input type="number" id="maBn" value="20" min="2" max="120"></div>
          <div class="row"><label><input type="checkbox" id="maC"><span class="swatch" style="background:var(--s3)"></span>MA</label><input type="number" id="maCn" value="60" min="2" max="240"></div>
          <div class="row"><label><input type="checkbox" id="boll">布林通道 (20, 2)</label></div>
          <div class="row"><label><input type="checkbox" id="sr">支撐 / 壓力線</label></div>
          <h3>副圖</h3>
          <div class="row"><select id="labSub"><option value="">無</option><option value="rsi">RSI (14)</option><option value="kd" selected>KD (9,3,3)</option><option value="macd">MACD (12,26,9)</option></select></div>
        </div>
        <div class="panel ctrl">
          <h3>判讀 <span class="note" id="roDate"></span></h3>
          <div class="readout" id="labReadout"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 判讀挑戰 -->
  <section id="view-challenge" role="tabpanel" hidden>
    <div class="chal-head">
      <div>
        <div class="eyebrow">CHALLENGE</div>
        <h2>接下來 10 天，會漲還是會跌？</h2>
        <p class="note" style="margin:6px 0 0; max-width: 60ch">先讀圖再作答。走勢是模擬的，帶有隨機性，猜錯很正常；重點是作答後對照指標，檢討自己看到了什麼、漏看了什麼。</p>
      </div>
      <div class="score">
        <div><div class="k">答對</div><div class="v" id="scRight">0 / 0</div></div>
        <div><div class="k">連勝</div><div class="v" id="scStreak">0</div></div>
        <div><div class="k">最佳連勝</div><div class="v" id="scBest">0</div></div>
      </div>
    </div>
    <div class="panel">
      <div class="chartbox" id="chalChart"></div>
      <div class="chal-bar">
        <label class="row" style="gap:6px"><input type="checkbox" id="chMA" checked>均線</label>
        <label class="row" style="gap:6px"><input type="checkbox" id="chBoll">布林</label>
        <select id="chSub" aria-label="副圖"><option value="">無副圖</option><option value="rsi">RSI</option><option value="kd" selected>KD</option><option value="macd">MACD</option></select>
        <span style="flex:1"></span>
        <button class="btn" id="chHint">看指標判讀</button>
        <button class="btn big buy" id="chUp">看漲 ▲</button>
        <button class="btn big sell" id="chDown">看跌 ▼</button>
      </div>
      <div class="verdict" id="chHintBox" hidden></div>
      <div class="verdict" id="chResult" hidden></div>
    </div>
  </section>

  <!-- 測驗 -->
  <section id="view-quiz" role="tabpanel" hidden>
    <div class="quiz" id="quiz"></div>
  </section>
</main>
<footer>本工具的價格與成交量皆為程式模擬，僅供學習技術分析之用，不代表任何個股，也不構成投資建議。</footer>

<script>
"use strict";
/* ================= 工具 ================= */
const $ = (s, r = document) => r.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem("kline:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("kline:" + k, JSON.stringify(v)); } catch {} },
};
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// 台股升降單位（檔位）
function tickOf(p) { return p < 10 ? 0.01 : p < 50 ? 0.05 : p < 100 ? 0.1 : p < 500 ? 0.5 : p < 1000 ? 1 : 5; }
function roundTick(p) { const t = tickOf(p); return +(Math.round(p / t) * t).toFixed(2); }
function fmtP(p) { if (p == null) return "—"; const t = tickOf(p); return p.toFixed(t < 0.1 ? 2 : t < 1 ? 1 : 0); }
function fmtPct(x, d = 2) { return (x >= 0 ? "+" : "") + (x * 100).toFixed(d) + "%"; }
function fmtN(x, d = 1) { return x == null ? "—" : x.toFixed(d); }
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ================= 模擬走勢 =================
   以「趨勢段落」切換漂移率（多頭 / 空頭 / 盤整），加上波動叢聚，

      const k = r();

      left = 12 + Math.floor(r() * 35);

    const c = roundTick(prev * Math.exp(ret));
    const h = roundTick(Math.min(hiLim, Math.max(o, c) * (1 + Math.abs(gauss()) * sig * 0.45)));
    const l = roundTick(Math.max(loLim, Math.min(o, c) * (1 - Math.abs(gauss()) * sig * 0.45)));
    const v = Math.max(50, Math.round(baseV * (0.55 + Math.abs(ret) / sig * 0.5) * Math.exp(gauss() * 0.3) * (mu > 0.001 && ret > 0 ? 1.3 : 1)));
    out.push({ d: d.toISOString().slice(0, 10), o, h: Math.max(h, o, c), l: Math.min(l, o, c), c, v });

}

/* ================= 回測 =================
   訊號出現後「隔日開盤價」成交；只做多、全額進出。

      ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, Y(k.h)); ctx.lineTo(Math.round(x) + 0.5, Y(k.l)); ctx.stroke();

    }

    mas.forEach(m => this.line(m.a, vis, X, Y, m.c, 1.6));
    // 標記
    const showLabels = o.labels !== false && bw >= 2.5;
    (o.markers || []).filter(m => m.i < vis).forEach(m => {
      const k = D[m.i], x = X(m.i), buy = m.side === "buy", c = m.note ? col.accent : buy ? col.up : col.down;
      const y = buy ? Y(k.l) + 8 : Y(k.h) - 8, s = 5;
      ctx.fillStyle = c; ctx.beginPath();
      if (buy) { ctx.moveTo(x, y); ctx.lineTo(x - s, y + s * 1.5); ctx.lineTo(x + s, y + s * 1.5); }
      else { ctx.moveTo(x, y); ctx.lineTo(x - s, y - s * 1.5); ctx.lineTo(x + s, y - s * 1.5); }
      ctx.closePath(); ctx.fill();
      if (showLabels && m.label) { ctx.font = `600 10.5px ${cssVar("--font-body")}`; ctx.textAlign = "center"; ctx.fillText(m.label, Math.min(Math.max(x, L + 24), L + pw - 24), buy ? y + s * 1.5 + 9 : y - s * 1.5 - 8); ctx.font = `11px ${cssVar("--font-mono")}`; }
    });

    // 成交量
    let vmax = 0; for (let i = 0; i < vis; i++) vmax = Math.max(vmax, D[i].v);
    ctx.globalAlpha = 0.6;
    for (let i = 0; i < vis; i++) { const k = D[i]; ctx.fillStyle = k.c >= k.o ? col.up : col.down; const h = k.v / vmax * (volH - 4); ctx.fillRect(Math.round(X(i) - cw / 2), volTop + volH - h, Math.max(1, Math.round(cw)), h); }
    ctx.globalAlpha = 1;
    this.line(I.vma, vis, X, v => volTop + volH - v / vmax * (volH - 4), col.muted, 1);
    ctx.fillStyle = col.muted; ctx.textAlign = "left"; ctx.font = `11px ${cssVar("--font-body")}`; ctx.fillText("量（張）", L + pw + 6, volTop + 6); ctx.font = `11px ${cssVar("--font-mono")}`;
    ctx.strokeStyle = col.line; ctx.beginPath(); ctx.moveTo(L, volTop - gap / 2); ctx.lineTo(L + pw, volTop - gap / 2); ctx.stroke();

    // 副圖
    if (o.sub) {
      ctx.strokeStyle = col.line; ctx.beginPath(); ctx.moveTo(L, subTop - gap / 2); ctx.lineTo(L + pw, subTop - gap / 2); ctx.stroke();
      const lvl = (v, sy) => { const y = sy(v); ctx.strokeStyle = col.line; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = col.muted; ctx.textAlign = "left"; ctx.fillText(String(v), L + pw + 6, y); };
      if (o.sub === "rsi" || o.sub === "kd") {
        const sy = v => subTop + (100 - v) / 100 * subH;
        const [a, b] = o.sub === "rsi" ? [70, 30] : [80, 20];
        ctx.fillStyle = col.band; ctx.fillRect(L, sy(100), pw, sy(a) - sy(100)); ctx.fillRect(L, sy(b), pw, sy(0) - sy(b));
        lvl(a, sy); lvl(b, sy);
        if (o.sub === "rsi") this.line(I.rsi, vis, X, sy, col.s2, 1.5);
        else { this.line(I.kd.K, vis, X, sy, col.s1, 1.5); this.line(I.kd.D, vis, X, sy, col.s3, 1.5); }

      }

    ctx.fillStyle = col.muted; ctx.textAlign = "center";
    for (let i = 0; i < n; i += every) { if (i >= vis && !o.cutoff) continue; ctx.fillText(D[i].d.slice(5).replace("-", "/"), Math.min(Math.max(X(i), L + 18), L + pw - 18), axY); }

    // 十字線
    const hi_ = this.hover;

      const y = Y(D[hi_].c); ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      ctx.fillStyle = col.ink; ctx.fillRect(L + pw + 2, y - 9, R - 4, 18); ctx.fillStyle = col.surface; ctx.textAlign = "left"; ctx.fillText(fmtP(D[hi_].c), L + pw + 6, y);
    }

    this.renderLegend(hi_ ?? vis - 1, mas);
    if (this.onHover) this.onHover(hi_ ?? vis - 1);
  }
  line(a, vis, X, Y, color, w, alpha = 1, dash) {
    const ctx = this.ctx; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.globalAlpha = alpha; if (dash) ctx.setLineDash(dash);

    for (let i = 0; i < vis; i++) { if (a[i] == null) { s = false; continue; } s ? ctx.lineTo(X(i), Y(a[i])) : ctx.moveTo(X(i), Y(a[i])); s = true; }
    ctx.stroke(); ctx.globalAlpha = 1; ctx.setLineDash([]);
  }
  renderLegend(i, mas) {

    const parts = [
      `<span><b>${k.d.replace(/-/g, "/")}</b></span>`,
      `<span><b>開</b>${fmtP(k.o)}</span>`, `<span><b>高</b>${fmtP(k.h)}</span>`, `<span><b>低</b>${fmtP(k.l)}</span>`,
      `<span class="${cls}"><b>收</b>${fmtP(k.c)} ${prev ? fmtPct(ch) : ""}</span>`,
      `<span><b>量</b>${k.v.toLocaleString()}</span>`,
    ];
    mas.forEach(m => parts.push(`<span style="color:${m.c}"><b style="color:inherit">MA${m.n}</b>${fmtP(m.a[i])}</span>`));
    if (o.boll) parts.push(`<span style="color:var(--accent)"><b style="color:inherit">布林</b>${fmtP(I.boll.up[i])} / ${fmtP(I.boll.lo[i])}</span>`);
    if (o.sub === "rsi") parts.push(`<span style="color:var(--s2)"><b style="color:inherit">RSI</b>${fmtN(I.rsi[i])}</span>`);
    if (o.sub === "kd") parts.push(`<span style="color:var(--s1)"><b style="color:inherit">K</b>${fmtN(I.kd.K[i])}</span><span style="color:var(--s3)"><b style="color:inherit">D</b>${fmtN(I.kd.D[i])}</span>`);
    if (o.sub === "macd") parts.push(`<span style="color:var(--s1)"><b style="color:inherit">DIF</b>${fmtN(I.macd.dif[i], 2)}</span><span style="color:var(--s3)"><b style="color:inherit">MACD</b>${fmtN(I.macd.sig[i], 2)}</span><span><b>OSC</b>${fmtN(I.macd.osc[i], 2)}</span>`);
    const mk = (o.markers || []).filter(m => m.i === i).map(m => m.label);
    if (mk.length) parts.push(`<span style="color:var(--accent)"><b style="color:inherit">訊號</b>${mk.join("、")}</span>`);

function niceStep(raw) { const p = 10 ** Math.floor(Math.log10(raw)), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }

  const ma = [["maA", "maAn"], ["maB", "maBn"], ["maC", "maCn"]].filter(([c]) => $("#" + c).checked).map(([, n]) => Math.max(2, Math.min(240, +$("#" + n).value || 5)));

  else {

const HORIZON = 10, SHOW = 120;
let ch = { right: 0, total: 0, streak: 0, best: store.get("best", 0), answered: false };
const chalChart = new Chart($("#chalChart"));
function chalNew() {
  ch.seed = Math.floor(Math.random() * 1e6); ch.D = genSeries(ch.seed, SHOW + HORIZON); ch.I = indicators(ch.D); ch.answered = false;
  $("#chHintBox").hidden = true; $("#chResult").hidden = true; $("#chUp").disabled = $("#chDown").disabled = false; $("#chHint").disabled = false;
  chalDraw();
}
function chalDraw() {
  chalChart.set(ch.D, { I: ch.I, ma: $("#chMA").checked ? [5, 20, 60] : [], boll: $("#chBoll").checked, sub: $("#chSub").value, visible: ch.answered ? ch.D.length : SHOW, cutoff: SHOW });
}
function chalScore() { $("#scRight").textContent = `${ch.right} / ${ch.total}`; $("#scStreak").textContent = ch.streak; $("#scBest").textContent = ch.best; }
function chalAnswer(guess) {
  if (ch.answered) return;
  ch.answered = true;
  const p0 = ch.D[SHOW - 1].c, p1 = ch.D[SHOW + HORIZON - 1].c, chg = (p1 - p0) / p0, actual = chg >= 0 ? 1 : -1, ok = guess === actual;
  ch.total++; if (ok) { ch.right++; ch.streak++; ch.best = Math.max(ch.best, ch.streak); store.set("best", ch.best); } else ch.streak = 0;
  chalScore(); chalDraw();
  $("#chUp").disabled = $("#chDown").disabled = true; $("#chHint").disabled = true;
  const items = readout(ch.D, ch.I, SHOW - 1), bull = items.filter(x => x.b > 0).length, bear = items.filter(x => x.b < 0).length;
  const lean = bull > bear ? 1 : bear > bull ? -1 : 0;
  const leanTxt = lean === 0 ? "指標多空各半，這種時候本來就難判斷，觀望也是一種選擇。" : `指標整體${lean > 0 ? "偏多" : "偏空"}（${bull} 項偏多、${bear} 項偏空），${lean === actual ? "這次和實際走勢一致。" : "但實際走勢相反，這就是指標失靈的時候；想想有沒有哪個細節其實在提醒你。"}`;
  $("#chResult").hidden = false; $("#chHintBox").hidden = true;
  $("#chResult").innerHTML = `<div class="big ${ok ? "up" : "down"}">${ok ? "答對了" : "這次猜錯"}</div>
    <div>10 天後收盤 <span class="num">${fmtP(p1)}</span>，相較作答時的 <span class="num">${fmtP(p0)}</span>，<span class="num ${chg >= 0 ? "up" : "down"}">${fmtPct(chg)}</span>。</div>
    <div class="note">${leanTxt}</div>
    <h3 style="margin-top:4px">作答當天的指標</h3><div id="chRo"></div>
    <div><button class="btn primary" id="chNext">下一題 →</button></div>`;
  renderReadout($("#chRo"), items, true);
  $("#chNext").addEventListener("click", chalNew);
}

  { q: "股價創新高，但 RSI 沒有跟著創新高，這稱為？", o: ["黃金交叉", "頂背離", "底背離", "多頭排列"], a: 1, e: "價格創高、指標沒創高是頂背離，代表上漲力道在減弱，是轉弱的警訊。" },
  { q: "在台股賣出一般股票時，需繳交的證券交易稅稅率是？", o: ["0.1425%", "0.3%", "1%", "免稅"], a: 1, e: "一般股票賣出課 0.3% 證交稅（當沖減半）；0.1425% 是券商手續費上限，買賣都要付。" },
  { q: "關於技術指標，下列敘述何者最正確？", o: ["找到對的指標就能穩定獲利", "指標越多越準", "指標是提高勝算的工具，仍需搭配停損與資金控管", "只要回測賺錢，未來一定賺錢"], a: 2, e: "沒有指標能保證獲利。技術分析的價值在於有規則地進出、控制虧損。" },
];
let quiz = null;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function quizStart() { quiz = { order: shuffle(QUESTIONS.map((_, i) => i)), k: 0, score: 0, picked: null }; quizRender(); }
function quizRender() {
  const el = $("#quiz"), N = quiz.order.length;
  if (quiz.k >= N) {
    const best = Math.max(store.get("quizBest", 0), quiz.score); store.set("quizBest", best);
    const pct = quiz.score / N;
    el.innerHTML = `<div class="panel qcard"><div class="eyebrow">RESULT</div><h2>${quiz.score} / ${N}</h2>
      <p style="margin:0">${pct >= 0.85 ? "觀念很扎實，可以到判讀挑戰實戰看看。" : pct >= 0.6 ? "基礎不錯。答錯的題目回到對應課程複習一下。" : "建議先把課程從頭走一遍，再回來挑戰。"}</p>
      <p class="note" style="margin:0">歷史最佳：${best} / ${N}</p>
      <div class="row"><button class="btn primary" id="qAgain">再測一次</button><button class="btn" id="qLearn">回到課程</button></div></div>`;
    $("#qAgain").addEventListener("click", quizStart); $("#qLearn").addEventListener("click", () => switchTab("learn"));
    return;
  }
  const Q = QUESTIONS[quiz.order[quiz.k]], ans = quiz.picked != null;
  el.innerHTML = `<div class="panel qcard">
    <div class="qmeta"><span>第 ${quiz.k + 1} / ${N} 題</span><span>得分 <span class="num">${quiz.score}</span></span></div>
    <div class="qbar"><i style="width:${quiz.k / N * 100}%"></i></div>
    <div class="qtext">${Q.q}</div>
    <div class="opts">${Q.o.map((t, i) => `<button data-i="${i}" ${ans ? "disabled" : ""} class="${ans && i === Q.a ? "right" : ans && i === quiz.picked ? "wrong" : ""}"><span class="l">${"ABCD"[i]}</span><span>${t}</span></button>`).join("")}</div>
    ${ans ? `<div class="explain"><strong class="${quiz.picked === Q.a ? "down" : "up"}">${quiz.picked === Q.a ? "正確。" : "答錯了。"}</strong>${Q.e}</div><div><button class="btn primary" id="qNext">${quiz.k === N - 1 ? "看結果" : "下一題 →"}</button></div>` : ""}
  </div>`;
  el.querySelectorAll(".opts button").forEach(b => b.addEventListener("click", () => { quiz.picked = +b.dataset.i; if (quiz.picked === Q.a) quiz.score++; quizRender(); }));
  if (ans) $("#qNext").addEventListener("click", () => { quiz.k++; quiz.picked = null; quizRender(); });
}

/* ================= 頁籤 ================= */
const TABS = ["learn", "lab", "challenge", "quiz"];
const inited = {};
function switchTab(t) {
  if (!TABS.includes(t)) t = "learn";
  TABS.forEach(x => { $("#view-" + x).hidden = x !== t; $("#tab-btn-" + x).setAttribute("aria-selected", x === t); });
  store.set("tab", t);
  if (!inited[t]) {
    inited[t] = true;
    if (t === "lab") { labData(); labDraw(); }
    if (t === "challenge") { chalScore(); chalNew(); }
    if (t === "quiz") quizStart();
  }
  window.scrollTo({ top: 0 });
}
$(".tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) { switchTab(b.dataset.tab); try { history.replaceState(null, "", "#" + b.dataset.tab); } catch {} } });

// 主題切換時重畫圖表
const redrawAll = () => [lessonChart, labChart, chalChart].forEach(c => c.draw());
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redrawAll); } catch {}
new MutationObserver(redrawAll).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
if (document.fonts) document.fonts.ready.then(redrawAll);

updateProgress();
showLesson(lessonIdx);
switchTab(location.hash.slice(1) || store.get("tab", "learn"));
</script>
</body>
