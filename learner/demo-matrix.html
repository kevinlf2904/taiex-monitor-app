<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>量價動能矩陣：12 種呈現方式（含放大縮小、回放與流動）</title>
<style>
  :root { --bg:#111214; --card:#191b1f; --line:#2a2d33; --tx:#e6e8eb; --mu:#8b929b;
          --up:#e8603c; --rot:#e2b23a; --watch:#9aa3ad; --down:#22a87a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; }
  header { padding:16px 24px 8px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; }
  h1 { font-size:18px; margin:0 0 2px; font-weight:600; }
  .sub { color:var(--mu); font-size:12.5px; }
  .golink { color:var(--tx); background:#252830; border:1px solid var(--line); border-radius:8px; padding:6px 12px; text-decoration:none; font-size:13px; font-weight:500; }
  .golink:hover { border-color:var(--tx); }
  nav { display:flex; flex-wrap:wrap; gap:6px; padding:4px 0 8px; border-bottom:1px solid var(--line); }
  nav button { background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:999px; padding:5px 12px; cursor:pointer; font:inherit; font-size:12.5px; }
  nav button[aria-pressed=true] { background:var(--tx); color:var(--bg); border-color:var(--tx); font-weight:600; }
  main { display:grid; grid-template-columns:minmax(0,1.4fr) 300px; gap:18px; padding:12px 24px 20px; max-width:1440px; margin:0 auto; align-items:start; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  .stage-wrap { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px 14px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .stage-wrap.fullscreen { position:fixed; inset:0; width:100vw; height:100vh; max-height:100vh; z-index:100; border-radius:0; border:0; padding:12px 22px 14px; overflow:hidden; background:var(--bg); display:flex; flex-direction:column; justify-content:space-between; }
  .stage-wrap.fullscreen nav { justify-content:center; flex-shrink:0; }
  .stage-wrap.fullscreen .rpbar { flex-shrink:0; }
  .stage-wrap.fullscreen .stage { flex:1 1 0; min-height:0; width:100%; overflow:hidden; }
  .stage-wrap.fullscreen .stage svg { width:100%; height:100%; max-width:100%; max-height:100%; display:block; margin:0 auto; }
  .rpbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 12px; background:#131519; border:1px solid var(--line); border-radius:8px; }
  .rpbar button { background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; font-size:12.5px; }
  .rpbar button.primary, .rpbar button[aria-pressed=true] { background:var(--tx); color:var(--bg); border-color:var(--tx); font-weight:600; }
  .rpbar input[type=range] { flex:1; min-width:120px; accent-color:var(--tx); cursor:pointer; }
  .rp-date { font-weight:600; font-size:13px; min-width:76px; text-align:center; font-variant-numeric:tabular-nums; }
  .stage { min-height:460px; position:relative; display:flex; align-items:center; justify-content:center; width:100%; }
  .stage svg { width:100%; height:auto; display:block; }
  aside { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  aside h2 { font-size:15px; margin:0 0 8px; }
  aside p { color:var(--mu); font-size:13px; margin:6px 0; }
  aside .pro b { color:#7fd6a8; } aside .con b { color:#f0a080; }
  .legend { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; font-size:12px; color:var(--mu); }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .tip { position:fixed; pointer-events:none; background:#0b0c0e; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; line-height:1.6; z-index:120; display:none; }
  text { fill:var(--tx); }
  .ax { stroke:#3a3e45; stroke-width:1; }
  .mu { fill:var(--mu); font-size:10px; }
  @keyframes mfStream { to { stroke-dashoffset: -28; } }
  .mf-flowing .mf-flow-line { stroke-dasharray: 5 4; animation: mfStream 1.1s linear infinite; }
  .mf-flowing .mf-flow-fast { stroke-dasharray: 7 4; animation: mfStream 0.65s linear infinite; }
  .mf-flowing .mf-flow-band { stroke-dasharray: 10 4; animation: mfStream 1.3s linear infinite; }
</style>
</head>
<body>
<header>
  <div>
    <h1>量價動能矩陣：12 種呈現方式（全模式支援放大縮小、回放與流動）</h1>
    <div class="sub">示意資料（18 個板塊 × 近 10 個交易日），可切換 12 種視覺化、播放跨日回放、開啟流動動畫或全螢幕放大。</div>
  </div>
  <a class="golink" href="watch.html#radar/matrix">前往看盤終端實盤矩陣 →</a>
</header>
<main>
  <div class="stage-wrap" id="stageWrap">
    <nav id="tabs"></nav>
    <div class="rpbar">
      <button type="button" id="btnPrev" title="前一天">‹</button>
      <button type="button" class="primary" id="btnPlay">▶ 回放</button>
      <button type="button" id="btnNext" title="後一天">›</button>
      <input type="range" id="rpRange" min="4" max="9" step="0.02" value="9" aria-label="回放日期">
      <span class="rp-date" id="rpDate">今日 (D0)</span>
      <button type="button" id="btnSpeed">1x</button>
      <button type="button" id="btnFlow" aria-pressed="true"><svg class="ico" width="1.05em" height="1.05em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.16em;margin-right:.32em" aria-hidden="true"><path d="M3 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg>流動</button>
      <button type="button" id="btnExpand" aria-pressed="false" style="margin-left:auto">⛶ 放大</button>
    </div>
    <div class="stage mf-flowing" id="stage"></div>
  </div>
  <aside id="info"></aside>
</main>
<div class="tip" id="tip"></div>

<script>
// ---------------- 示意資料：18 個板塊、近 10 個交易日的法人淨額（億） ----------------
const Q = { up:["強勢突破區","淨流入且加速","#e8603c"], rot:["高檔調節區","淨流入但放緩","#e2b23a"],
            watch:["主力吸籌區","淨流出但放緩","#9aa3ad"], down:["量縮整理區","淨流出且加速","#22a87a"] };
const quad = (n, a) => n > 0 ? (a > 0 ? "up" : "rot") : (a > 0 ? "watch" : "down");
const NAMES = ["半導體","AI伺服器","散熱","矽光子","PCB","記憶體","IC設計","網通","金融","航運","鋼鐵","塑化","生技","電動車","重電","營建","觀光","被動元件"];
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const SECS = NAMES.map((name, i) => {
  const bias = (rnd() - 0.45) * 30, trend = (rnd() - 0.5) * 8;
  const d = Array.from({ length: 10 }, (_, k) => +(bias + trend * (k - 5) + (rnd() - 0.5) * 16).toFixed(1));
  return { id: "s" + i, name, d };
});
const sum = (a, s, e) => a.slice(Math.max(0, s), Math.min(a.length, e)).reduce((x, y) => x + y, 0);
const atInt = (s, t) => {
  t = Math.max(1, Math.min(9, t));
  const net5 = sum(s.d, t - 4, t + 1), prev = sum(s.d, t - 5, t), accel = net5 - prev;
  return { net5: +net5.toFixed(2), accel: +accel.toFixed(2), net1: s.d[t], q: quad(net5, accel) };
};
function colorLerp(c1, c2, s) {
  if (!c1 || !c2 || c1 === c2 || s <= 0) return c1 || c2;
  if (s >= 1) return c2;
  const p = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const a = p(c1), b = p(c2);
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * s)},${Math.round(a[1] + (b[1] - a[1]) * s)},${Math.round(a[2] + (b[2] - a[2]) * s)})`;
}
const cr = (p0, p1, p2, p3, f) => { const f2 = f * f, f3 = f2 * f; return 0.5 * (2 * p1 + (-p0 + p2) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f2 + (-p0 + 3 * p1 - 3 * p2 + p3) * f3); };
function atU(s, u) {
  const x = Math.max(1, Math.min(9, u)), i = Math.min(8, Math.floor(x)), f = x - i, sm = f * f * (3 - 2 * f);
  const p0 = atInt(s, Math.max(1, i - 1)), p1 = atInt(s, i), p2 = atInt(s, i + 1), p3 = atInt(s, Math.min(9, i + 2));
  const net5 = cr(p0.net5, p1.net5, p2.net5, p3.net5, f), accel = cr(p0.accel, p1.accel, p2.accel, p3.accel, f);
  const net1 = p1.net1 + (p2.net1 - p1.net1) * f, q = f < 0.5 ? p1.q : p2.q;
  return { net5, accel, net1, q, col: colorLerp(Q[p1.q][2], Q[p2.q][2], sm) };
}
let curU = 9, curIdx = 0, playing = false, speed = 1, flowOn = true, raf = 0;
function syncAtU(u) {
  SECS.forEach(s => {
    const cur = atU(s, u), prev = atU(s, Math.max(1, u - 1));
    s.net5 = cur.net5; s.accel = cur.accel; s.net1 = cur.net1; s.q = cur.q; s.col = cur.col; s.prev = prev;
    s.trail = [4, 3, 2, 1, 0].map(d => atU(s, Math.max(1, u - d)));
    const tEnd = Math.round(u);
    s.dSlice = s.d.slice(0, tEnd + 1);
  });
}
syncAtU(curU);

const fmt = v => (v >= 0 ? "+" : "") + v.toFixed(1) + " 億";
const col = s => s.col || Q[s.q][2];

// ---------------- 共用 ----------------
const stage = document.getElementById("stage"), stageWrap = document.getElementById("stageWrap"), info = document.getElementById("info"), tip = document.getElementById("tip");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const tipHtml = s => `<b style="color:${col(s)}">${esc(s.name)}</b>　${Q[s.q][0]}<br>近 5 日淨流入 ${fmt(s.net5)}<br>加速度 ${fmt(s.accel)}<br>當日 ${fmt(s.net1)}`;
document.addEventListener("pointermove", e => {
  const el = e.target.closest("[data-id]");
  if (!el) { tip.style.display = "none"; return; }
  const s = SECS.find(x => x.id === el.dataset.id);
  tip.innerHTML = el.dataset.tip || tipHtml(s); tip.style.display = "block";
  tip.style.left = Math.min(innerWidth - 220, e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px";
});
const legend = () => `<div class="legend">${Object.values(Q).map(q => `<span><i style="background:${q[2]}"></i>${q[0]}</span>`).join("")}</div>`;
const sq = (v, m) => Math.sign(v) * Math.sqrt(Math.min(1, Math.abs(v) / (m || 1)));
const mxN = Math.max(...SECS.flatMap(s => [4,5,6,7,8,9].map(t => Math.abs(atInt(s, t).net5))));
const mxA = Math.max(...SECS.flatMap(s => [4,5,6,7,8,9].map(t => Math.abs(atInt(s, t).accel))));
function stageDims(H = 560) {
  const isFull = stageWrap.classList.contains("fullscreen");
  const vw = window.innerWidth || 1280, vh = window.innerHeight || 720;
  if (isFull) {
    const ar = Math.max(0.85, Math.min(2.35, Math.max(320, vw - 44) / Math.max(240, vh - 130)));
    return { W: Math.round(H * ar), H };
  }
  if (vw > 900) {
    const colW = Math.min(1060, Math.max(520, vw - 370)), availH = Math.max(400, Math.min(640, vh - 190));
    const ar = Math.max(1.25, Math.min(1.85, colW / availH));
    return { W: Math.round(H * ar), H };
  }
  return { W: 760, H };
}
function quadFrame(W, H, P) {
  const cx = W / 2, cy = H / 2;
  return `<rect x="${cx}" y="${P}" width="${cx - P}" height="${cy - P}" fill="${Q.up[2]}" opacity=".05"/>
    <rect x="${P}" y="${cy}" width="${cx - P}" height="${cy - P}" fill="${Q.down[2]}" opacity=".05"/>
    <line class="ax" x1="${cx}" y1="${P}" x2="${cx}" y2="${H - P}"/><line class="ax" x1="${P}" y1="${cy}" x2="${W - P}" y2="${cy}"/>
    <text x="${P + 4}" y="${P + 14}" style="fill:${Q.watch[2]};font-size:12px">↖ ${Q.watch[0]}</text>
    <text x="${W - P - 4}" y="${P + 14}" text-anchor="end" style="fill:${Q.up[2]};font-size:12px">${Q.up[0]} ↗</text>
    <text x="${P + 4}" y="${H - P - 6}" style="fill:${Q.down[2]};font-size:12px">↙ ${Q.down[0]}</text>
    <text x="${W - P - 4}" y="${H - P - 6}" text-anchor="end" style="fill:${Q.rot[2]};font-size:12px">${Q.rot[0]} ↘</text>
    <text class="mu" x="${W - P - 4}" y="${cy - 6}" text-anchor="end">主力淨流入 →</text>
    <text class="mu" x="${cx + 6}" y="${P + 30}">動能加速 ↑</text>`;
}

// ---------------- 0. 圓點矩陣 ----------------
function vBubble() {
  const { W, H } = stageDims(560), P = 20, cx = W / 2, cy = H / 2;
  const px = p => cx + sq(p.net5, mxN) * (cx - P - 24), py = p => cy - sq(p.accel, mxA) * (cy - P - 24);
  let g = "";
  SECS.forEach(s => {
    const x = px(s), y = py(s), x0 = px(s.prev), y0 = py(s.prev), r = 14 + 22 * Math.sqrt(Math.abs(s.net5) / mxN);
    g += `<g data-id="${s.id}" style="cursor:pointer">
      <line class="mf-flow-line" x1="${x0}" y1="${y0}" x2="${x}" y2="${y}" stroke="${col(s)}" stroke-width="1.4" stroke-opacity=".45"/>
      <circle class="mf-flow-line" cx="${x}" cy="${y}" r="${r + 2.5}" fill="none" stroke="${col(s)}" stroke-width="1" stroke-opacity=".45"/>
      <circle cx="${x}" cy="${y}" r="${r}" fill="${col(s)}" fill-opacity=".45" stroke="${col(s)}" stroke-width="1.5"/>
      <text x="${x}" y="${y - 2}" text-anchor="middle" style="font-size:11.5px;font-weight:500">${esc(s.name)}</text>
      <text x="${x}" y="${y + 11}" text-anchor="middle" style="font-size:9.5px;opacity:.8">${fmt(s.net5)}</text></g>`;
  });
  stage.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${quadFrame(W, H, P)}${g}</svg>`;
  return { t: "圓點矩陣（經典四象限）", d: "圓點位置代表近 5 日主力淨流入與動能加速度，圓面積代表資金規模，外圈虛線流動環與尾跡顯示當日動能方向。",
    pro: "直覺呈現四象限位置與資金規模大小。", con: "板塊密集時可切換至象限磚塊或引線散佈圖。" };
}

// ---------------- 1. 輪動軌跡圖（RRG 風格） ----------------
function vTrail() {
  const { W, H } = stageDims(560), P = 20, cx = W / 2, cy = H / 2;
  const px = p => cx + sq(p.net5, mxN) * (cx - P - 14), py = p => cy - sq(p.accel, mxA) * (cy - P - 14);
  let g = "";
  SECS.forEach(s => {
    const pts = s.trail.map(p => [px(p), py(p)]);
    g += `<g data-id="${s.id}" style="cursor:pointer">
      <polyline class="mf-flow-fast" points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="${col(s)}" stroke-width="1.8" stroke-opacity=".65" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.slice(0, -1).map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${1.5 + i * 0.5}" fill="${col(s)}" opacity="${0.25 + i * 0.12}"/>`).join("")}
      <circle cx="${pts[4][0]}" cy="${pts[4][1]}" r="6" fill="${col(s)}"/>
      <text x="${pts[4][0] + 9}" y="${pts[4][1] + 4}" style="font-size:11.5px;fill:${col(s)}">${esc(s.name)}</text></g>`;
  });
  stage.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${quadFrame(W, H, P)}${g}</svg>`;
  return { t: "輪動軌跡圖（RRG 風格）", d: "每個板塊畫出近 5 天在四象限中的移動路徑，實心大點是今天，越淡的小點越早。順時針轉＝資金正在輪動進來或撤出。",
    pro: "一眼看出「方向」：誰剛從吸籌區轉進突破區、誰正從高檔往下掉。這是法人最常用的類股輪動圖。", con: "板塊太多時線會交錯，適合只看前 10～15 名或搭配篩選。" };
}

// ---------------- 2. 資金矩形樹圖 ----------------
function squarify(items, x, y, w, h) {
  const out = [], total = items.reduce((a, b) => a + b.v, 0); if (!total) return out;
  const scale = (w * h) / total; let rest = items.map(i => ({ ...i, a: i.v * scale }));
  while (rest.length) {
    const side = Math.min(w, h); let row = [], best = Infinity;
    for (const it of rest) { const r = [...row, it], s = r.reduce((a, b) => a + b.a, 0);
      const worst = Math.max(...r.map(z => Math.max((side * side * z.a) / (s * s), (s * s) / (side * side * z.a))));
      if (worst > best) break; best = worst; row = r; }
    const s = row.reduce((a, b) => a + b.a, 0), thick = s / side; let off = 0;
    row.forEach(z => { const len = z.a / thick;
      out.push(w >= h ? { ...z, x, y: y + off, w: thick, h: len } : { ...z, x: x + off, y, w: len, h: thick }); off += len; });
    if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
    rest = rest.slice(row.length);
  }
  return out;
}
function vTree() {
  const { W, H } = stageDims(540);
  const groups = ["up", "rot", "watch", "down"].map(q => ({ q, items: SECS.filter(s => s.q === q).map(s => ({ s, v: Math.abs(s.net5) + 1 })).sort((a, b) => b.v - a.v) }))
    .filter(g => g.items.length).map(g => ({ ...g, v: g.items.reduce((a, b) => a + b.v, 0) }));
  const blocks = squarify(groups, 0, 0, W, H);
  let g = "";
  blocks.forEach(b => {
    g += `<text x="${b.x + 6}" y="${b.y + 15}" style="fill:${Q[b.q][2]};font-size:12px;font-weight:600">${Q[b.q][0]}</text>`;
    squarify(b.items, b.x + 2, b.y + 22, b.w - 4, b.h - 24).forEach(c => {
      const big = c.w > 60 && c.h > 34, s = c.s;
      g += `<g data-id="${s.id}" style="cursor:pointer"><rect class="mf-flow-band" x="${c.x + 1}" y="${c.y + 1}" width="${Math.max(0, c.w - 2)}" height="${Math.max(0, c.h - 2)}" rx="4"
        fill="${col(s)}" fill-opacity="${0.18 + 0.6 * Math.min(1, Math.abs(s.net5) / mxN)}" stroke="${col(s)}" stroke-opacity=".55"/>
        ${c.w > 34 && c.h > 18 ? `<text x="${c.x + 7}" y="${c.y + 18}" style="font-size:${big ? 13 : 10.5}px;font-weight:500">${esc(s.name)}</text>` : ""}
        ${big ? `<text x="${c.x + 7}" y="${c.y + 34}" style="font-size:11px;opacity:.8">${fmt(s.net5)}</text>` : ""}</g>`;
    });
  });
  stage.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
  return { t: "資金矩形樹圖（Treemap）", d: "先依四象限分成四大塊，塊內每個矩形是一個板塊，面積＝近 5 日淨流入（或流出）規模，顏色深淺＝強度。",
    pro: "空間利用率最高，所有板塊名稱和金額幾乎都放得下，不會有標籤擠不下的問題；適合電腦大螢幕。", con: "看不出「加速度」的大小，只知道落在哪個象限。" };
}

// ---------------- 3. 背離條形圖 ----------------
function vBar() {
  const rows = SECS.slice().sort((a, b) => b.net5 - a.net5), RH = 28, H = rows.length * RH + 40, { W } = stageDims(H), L = 110, cx = L + (W - L - 20) / 2;
  const mx = Math.max(...rows.map(s => Math.abs(s.net5))) || 1, half = (W - L - 20) / 2, mA = Math.max(...rows.map(s => Math.abs(s.accel))) || 1;
  let g = `<line class="ax" x1="${cx}" y1="10" x2="${cx}" y2="${H - 24}"/>
    <text class="mu" x="${cx - 6}" y="${H - 8}" text-anchor="end">← 淨流出</text><text class="mu" x="${cx + 6}" y="${H - 8}">淨流入 →</text>`;
  rows.forEach((s, i) => { const y = 14 + i * RH, w = (Math.abs(s.net5) / mx) * half, x = s.net5 >= 0 ? cx : cx - w;
    const ax = cx + (s.accel / mA) * half * 0.9;
    g += `<g data-id="${s.id}" style="cursor:pointer"><rect x="${L - 104}" y="${y - 2}" width="${W - L + 90}" height="${RH - 4}" fill="transparent"/>

  stage.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
  return { t: "象限移轉流向圖（Sankey）", d: "左邊是前一日各象限有幾個板塊，右邊是當日；中間的帶子表示板塊從哪一區移到哪一區，換區的帶子較深並直接寫出名稱。",
    pro: "專門回答「有誰換區了」，例如誰從吸籌區轉進突破區，是很好的盤後重點提示。", con: "看不到每個板塊的金額，只適合當輔助圖。" };
}

// ---------------- 11. 雙指標棒棒糖圖 ----------------
function vLolli() {
  const rows = SECS.slice().sort((a, b) => b.net5 - a.net5), RH = 27, H = rows.length * RH + 50, { W } = stageDims(H), M = W / 2, NWd = 46, half = Math.max(220, Math.min(420, (W - NWd * 2 - 40) / 2));
  const mA = Math.max(...rows.map(s => Math.abs(s.accel))) || 1, mN = Math.max(...rows.map(s => Math.abs(s.net5))) || 1;
  const c1 = M - NWd - half / 2, c2 = M + NWd + half / 2;
  let g = `<text class="mu" x="${c1}" y="16" text-anchor="middle">近 5 日淨流入（← 流出｜流入 →）</text><text class="mu" x="${c2}" y="16" text-anchor="middle">加速度（← 放緩｜加速 →）</text>
    <line class="ax" x1="${c1}" y1="26" x2="${c1}" y2="${H - 10}"/><line class="ax" x1="${c2}" y1="26" x2="${c2}" y2="${H - 10}"/>`;
  rows.forEach((s, i) => { const y = 40 + i * RH, x1 = c1 + (s.net5 / mN) * (half / 2 - 8), x2 = c2 + (s.accel / mA) * (half / 2 - 8);
    g += `<g data-id="${s.id}" style="cursor:pointer"><rect x="0" y="${y - 12}" width="${W}" height="${RH}" fill="transparent"/>
      <text x="${M}" y="${y + 4}" text-anchor="middle" style="font-size:12.5px;fill:${col(s)}">${esc(s.name)}</text>
      <line class="mf-flow-line" x1="${c1}" y1="${y}" x2="${x1}" y2="${y}" stroke="${col(s)}" stroke-width="2"/><circle cx="${x1}" cy="${y}" r="5" fill="${col(s)}"/>
      <line class="mf-flow-line" x1="${c2}" y1="${y}" x2="${x2}" y2="${y}" stroke="${col(s)}" stroke-width="2" stroke-opacity=".7"/><circle cx="${x2}" cy="${y}" r="5" fill="none" stroke="${col(s)}" stroke-width="2"/></g>`; });
  stage.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
  return { t: "雙指標棒棒糖圖", d: "名稱在中間，左邊畫近 5 日淨流入、右邊畫加速度。兩邊都往右＝強勢突破區；左右方向不同就是其他象限。",
    pro: "把矩陣的兩個軸拆開成兩欄，數值比較精準，排行和象限一次看到，手機也清楚。", con: "需要左右對照才知道象限，直覺性比二維圖低一點。" };
}

// ---------------- 分頁、回放、流動與放大縮小 ----------------
const VIEWS = [["圓點矩陣", vBubble], ["象限磚塊", vTiles], ["引線散佈", vLeader], ["資金羅盤", vCompass], ["移轉流向", vFlow], ["雙指標棒棒糖", vLolli],
  ["輪動軌跡", vTrail], ["矩形樹圖", vTree], ["背離條形", vBar], ["熱力格", vHeat], ["四象限看板", vBoard], ["位移箭頭", vArrow]];
const tabs = document.getElementById("tabs"), rpRange = document.getElementById("rpRange"), rpDate = document.getElementById("rpDate");
const btnPlay = document.getElementById("btnPlay"), btnSpeed = document.getElementById("btnSpeed"), btnFlow = document.getElementById("btnFlow"), btnExpand = document.getElementById("btnExpand");

function renderCur(updateInfo = false) {
  syncAtU(curU);
  const r = VIEWS[curIdx][1]();
  const dIdx = Math.round(curU);
  rpDate.textContent = dIdx === 9 ? "今日 (D0)" : `D-${9 - dIdx}`;
  if (document.activeElement !== rpRange) rpRange.value = curU.toFixed(2);
  if (updateInfo) info.innerHTML = `<h2>${r.t}</h2><p>${r.d}</p><p class="pro"><b>優點：</b>${r.pro}</p><p class="con"><b>缺點：</b>${r.con}</p>${legend()}`;
}
function show(i) {
  curIdx = i;
  [...tabs.children].forEach((b, k) => b.setAttribute("aria-pressed", k === i));
  renderCur(true);
}
VIEWS.forEach(([t], i) => { const b = document.createElement("button"); b.textContent = t; b.onclick = () => show(i); tabs.appendChild(b); });

function setPlay(on) {
  playing = on; cancelAnimationFrame(raf);
  btnPlay.textContent = playing ? "❚❚ 暫停" : "▶ 回放";
  if (!playing) return;
  if (curU >= 9) curU = 4;
  let last = performance.now(), hold = 0;
  const loop = now => {
    if (!playing) return;
    const dt = Math.min(100, now - last); last = now;
    if (hold > 0) { hold -= dt; if (hold <= 0) curU = 4; }
    else { curU += (dt / 1000) * 0.7 * speed; if (curU >= 9) { curU = 9; hold = 900; } }
    renderCur(false);
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}
btnPlay.onclick = () => setPlay(!playing);
document.getElementById("btnPrev").onclick = () => { setPlay(false); curU = Math.max(4, Math.round(curU) - 1); renderCur(false); };
document.getElementById("btnNext").onclick = () => { setPlay(false); curU = Math.round(curU) + 1 > 9 ? 4 : Math.round(curU) + 1; renderCur(false); };
rpRange.oninput = e => { setPlay(false); curU = +e.target.value; renderCur(false); };
btnSpeed.onclick = () => { speed = speed >= 4 ? 1 : speed * 2; btnSpeed.textContent = speed + "x"; };
btnFlow.onclick = () => { flowOn = !flowOn; btnFlow.setAttribute("aria-pressed", flowOn); stage.classList.toggle("mf-flowing", flowOn); };
function toggleExpand(force) {
  const on = typeof force === "boolean" ? stageWrap.classList.toggle("fullscreen", force) : stageWrap.classList.toggle("fullscreen");
  btnExpand.textContent = on ? "✕ 縮小" : "⛶ 放大";
  btnExpand.setAttribute("aria-pressed", on);
  renderCur(false);
}
btnExpand.onclick = () => toggleExpand();
document.addEventListener("keydown", e => { if (e.key === "Escape" && stageWrap.classList.contains("fullscreen")) toggleExpand(false); });
window.addEventListener("resize", () => renderCur(false));

show(0);
</script>
<script type="module" src="analytics-init.js"></script>
