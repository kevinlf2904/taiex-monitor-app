# 股價月新高／月新低：每個交易日收盤後更新每檔最近 21 個交易日的收盤價（learner/data/market/hilo.json）
name: market-hilo
on:
  schedule:
    - cron: "45 6 * * 1-5"   # 台北 14:45
    - cron: "10 12 * * 1-5"  # 台北 20:10（櫃買資料較晚時補抓）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-sync-market-hilo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  hilo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 排隊等前一次跑完時，checkout 的是排隊當下的舊版本；先拉到最新的 main，避免和前一次存的資料衝突
      - run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/market-hilo.mjs
      - name: commit
        env:
          COMMIT_NAME: market-hilo
        run: |
          bash scripts/commit-data.sh "大盤：更新月新高月新低用的收盤資料" learner/data/market
