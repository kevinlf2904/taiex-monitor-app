# 股價月新高／月新低：每個交易日收盤後更新每檔最近 21 個交易日的收盤價（learner/data/market/hilo.json）
name: market-hilo
on:
  schedule:
    - cron: "45 6 * * 1-5"   # 台北 14:45
    - cron: "10 12 * * 1-5"  # 台北 20:10（櫃買資料較晚時補抓）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-hilo
  cancel-in-progress: false
jobs:
  hilo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/market-hilo.mjs
      - name: commit
        run: |
          git config user.name "market-hilo"
          git config user.email "market-hilo@users.noreply.github.com"
          git add learner/data/market
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "大盤：更新月新高月新低用的收盤資料"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
