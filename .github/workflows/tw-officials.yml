# 台灣政治人物財產申報（持股）：從監察院廉政專刊整理（learner/data/tw-officials.json）；每個交易日收盤後也更新持股的收盤價（算持股市值排行）
name: tw-officials
on:
  schedule:
    - cron: "45 8 * * 1-5"   # 週一到五台北 16:45：收盤價更新後；新出刊的廉政專刊（週二、四）也會在當天讀到
  workflow_dispatch:
    inputs:
      dump:
        description: "除錯：1＝只印出期別與 PDF 文字，不存檔（0＝正常更新）"
        default: "0"
permissions:
  contents: write
concurrency:
  group: data-sync-tw-officials-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 廉政專刊是 PDF，用 pdfjs 讀文字（只在排程裡安裝，網站本身不需要）
      - run: npm i --no-save --no-audit --no-fund pdfjs-dist@4.10.38
      - if: ${{ github.event.inputs.dump && github.event.inputs.dump != '0' }}
        run: node scripts/tw-officials.mjs --dump
      - if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: node scripts/tw-officials.mjs
      - name: commit
        if: ${{ github.ref == 'refs/heads/main' && (!github.event.inputs.dump || github.event.inputs.dump == '0') }}
        env:
          COMMIT_NAME: tw-officials
        run: |
          bash scripts/commit-data.sh "台灣政治人物：更新財產申報持股" learner/data/tw-officials.json learner/data/tw-officials-docs.json
