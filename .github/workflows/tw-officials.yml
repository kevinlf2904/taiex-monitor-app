# 台灣政治人物財產申報（持股）：每週從監察院廉政專刊整理（learner/data/tw-officials.json）
name: tw-officials
on:
  schedule:
    - cron: "30 1 * * 3,5"   # 每週三、五台北 09:30（廉政專刊週二、四出刊）
  workflow_dispatch:
    inputs:
      dump:
        description: "除錯：1＝只印出期別與 PDF 文字，不存檔（0＝正常更新）"
        default: "0"
permissions:
  contents: write
concurrency:
  group: tw-officials
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: git pull -q origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 廉政專刊是 PDF，用 pdfjs 讀文字（只在排程裡安裝，網站本身不需要）
      - run: npm i --no-save --no-audit --no-fund pdfjs-dist@4.10.38
      - if: ${{ github.event.inputs.dump && github.event.inputs.dump != '0' }}
        run: node scripts/tw-officials.mjs --dump
      - if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: node scripts/tw-officials.mjs
      - name: commit
        if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: |
          git config user.name "tw-officials"
          git config user.email "tw-officials@users.noreply.github.com"
          git add learner/data/tw-officials.json learner/data/tw-officials-docs.json
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "台灣政治人物：更新財產申報持股"
          for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
