# 自動測試：每個 PR 和推到 main 時跑 tests/run.mjs（排程解析的單元測試＋學堂、看盤每個分頁的瀏覽器測試，任何頁面錯誤都算失敗）
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review] # draft PR（大檔上鎖用）不跑，轉成 ready for review 才跑
    paths: ["learner/**", "api/**", "scripts/**", "tests/**", ".github/workflows/**", "AGENTS.md", "CLAUDE.md", ".agent/**", ".claude/settings.json", "vercel.json", "package.json", "package-lock.json"] # 轉址設定、相依套件改了也要測
  push:
    branches: [main]
    paths: ["learner/**.js", "learner/**.html", "learner/**.css", "api/**", "scripts/**", "tests/**", ".github/workflows/**", "vercel.json", "package.json", "package-lock.json"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04 # ubuntu-latest 已換成 26.04，Playwright 1.56 不支援，裝不了 chromium
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm i --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: for f in learner/*.js scripts/*.mjs api/*.js api/_lib/*.js; do node --check "$f" || exit 1; done
      - run: node tests/run.mjs
