# ETF 年化報酬排行：每週一收盤後，用 Yahoo 月線還原收盤（含息）重算 ETF 專區每一檔的 1／3／5／10 年年化與最大跌幅（learner/data/etf-annual.json）
name: etf-annual
on:
  schedule:
    - cron: "30 7 * * 1"   # 每週一台北 15:30
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-sync-etf-annual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  annual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # 排隊等前一次跑完時，checkout 的是排隊當下的舊版本；先拉到最新的 main，避免和前一次存的資料衝突
      - run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/etf-annual.mjs
        env: # Yahoo 拿不到時改問 FinMind，帶金鑰才不會用匿名額度
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: commit
        if: github.ref == 'refs/heads/main'   # 只有 main 會寫資料；分支上手動跑只看 log
        env:
          COMMIT_NAME: etf-annual
        run: |
          bash scripts/commit-data.sh "ETF：更新年化報酬排行" learner/data/etf-annual.json
