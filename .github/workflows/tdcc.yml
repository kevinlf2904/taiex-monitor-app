# 集保股權分散：每週六從集保結算所開放資料整理大戶、散戶持股比例，累積到 learner/data/tdcc/
name: tdcc
on:
  schedule:
    - cron: "20 2 * * 6"   # 每週六台北 10:20（集保週五晚上公布）
  workflow_dispatch:
    inputs:
      dump:
        description: "除錯：1＝只印出抓到的原始資料、不存檔（0＝正常更新）"
        default: "0"
      backfill:
        description: "補歷史：從集保網站補幾檔歷史最短的股票（網站保留最近一年；0＝只做每週更新，順便補 60 檔）"
        default: "0"
permissions:
  contents: write
concurrency:
  group: data-sync-tdcc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: ${{ github.event.inputs.dump && github.event.inputs.dump != '0' }}
        run: node scripts/tdcc.mjs --dump
      - if: ${{ (!github.event.inputs.dump || github.event.inputs.dump == '0') && (!github.event.inputs.backfill || github.event.inputs.backfill == '0') }}
        run: node scripts/tdcc.mjs
      - if: ${{ (!github.event.inputs.dump || github.event.inputs.dump == '0') && github.event.inputs.backfill && github.event.inputs.backfill != '0' }}
        env:
          N: ${{ github.event.inputs.backfill }}
        run: node scripts/tdcc.mjs --backfill "$N" --minutes 100
      - name: commit
        if: ${{ github.ref == 'refs/heads/main' && (!github.event.inputs.dump || github.event.inputs.dump == '0') }}
        env:
          COMMIT_NAME: tdcc
        run: |
          bash scripts/commit-data.sh "集保：更新股權分散" learner/data/tdcc
