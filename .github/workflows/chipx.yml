# 籌碼補充：每個交易日晚上整理借券賣出、當日沖銷比例、選擇權 Put/Call 比與臺指選擇權各履約價未平倉（learner/data/chipx.json）
name: chipx
on:
  schedule:
    - cron: "50 11 * * 1-5" # 週一到週五台北 19:50
  workflow_dispatch:
    inputs:
      dump:
        description: "除錯：1＝只印出抓到的原始資料、不存檔（0＝正常更新）"
        default: "0"
permissions:
  contents: write
concurrency:
  group: data-sync-chipx-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - if: ${{ github.event.inputs.dump && github.event.inputs.dump != '0' }}
        run: node scripts/chipx.mjs --dump
      - if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: node scripts/chipx.mjs
      - name: data push token
        id: datatoken
        if: ${{ github.ref == 'refs/heads/main' && vars.DATA_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: commit
        if: ${{ github.ref == 'refs/heads/main' && (!github.event.inputs.dump || github.event.inputs.dump == '0') }}
        env:
          COMMIT_NAME: chipx
          DATA_PUSH_TOKEN: ${{ steps.datatoken.outputs.token }}
        run: |
          bash scripts/commit-data.sh "籌碼：更新借券、當沖、Put/Call 比、選擇權未平倉" learner/data/chipx.json
