# 國會山交易：每天從眾議院書記官、參議院電子申報系統抓新的定期交易報告（PTR），整理成 learner/data/congress.json
name: congress
on:
  schedule:
    - cron: "37 23 * * *"   # 每天台北 07:37（美東前一天晚上，當天的申報大多已公開）
    - cron: "37 11 * * 1-5" # 週一到週五台北 19:37 再補一次
  workflow_dispatch:
    inputs:
      dump:
        description: "除錯：印出幾份解析不到交易的眾議院 PTR 原文（0＝正常更新）"
        default: "0"
      year:
        description: "補更早的年份：填年份（例如 2025）就讀那一年申報的全部 PTR，存到 learner/data/congress-arch/；空白＝正常更新"
        default: ""
permissions:
  contents: write
concurrency:
  group: data-sync-congress-${{ github.ref }}
  cancel-in-progress: false
jobs:
  congress:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # 眾議院的申報是 PDF，用 pdfjs 讀文字（只在排程裡安裝，網站本身不需要）
      - run: npm i --no-save --no-audit --no-fund pdfjs-dist@4.10.38
      - if: ${{ github.event.inputs.dump && github.event.inputs.dump != '0' }}
        env:
          INPUT_DUMP: ${{ github.event.inputs.dump }}
        run: |
          D_VAL="5"
          if [[ "$INPUT_DUMP" =~ ^[0-9]{1,3}$ ]]; then
            D_VAL="$INPUT_DUMP"
          fi
          node scripts/congress.mjs --dump "$D_VAL"
      - if: ${{ (!github.event.inputs.dump || github.event.inputs.dump == '0') && !github.event.inputs.year }}
        run: node scripts/congress.mjs
      - if: ${{ (!github.event.inputs.dump || github.event.inputs.dump == '0') && github.event.inputs.year }}
        env:
          YEAR: ${{ github.event.inputs.year }}
        run: node scripts/congress.mjs --year "$YEAR" --minutes 85
      - name: commit
        if: ${{ github.ref == 'refs/heads/main' && (!github.event.inputs.dump || github.event.inputs.dump == '0') }}
        env:
          COMMIT_NAME: congress
          YEAR: ${{ github.event.inputs.year }}
        run: |
          if [ -n "$YEAR" ]; then bash scripts/commit-data.sh "國會山：補 ${YEAR//[^0-9]/} 年申報" learner/data/congress-arch
          else bash scripts/commit-data.sh "國會山：更新議員交易申報" learner/data/congress.json learner/data/congress-docs.json; fi
