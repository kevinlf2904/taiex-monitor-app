# ETF 殖利率排行：每個交易日收盤後，用 Yahoo 配息紀錄重算全部台股 ETF 的近 12 個月殖利率（learner/data/etf-yield.json）
name: etf-yield
on:
  schedule:
    - cron: "20 8 * * 1-5"   # 週一到週五台北 16:20
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: etf-yield
  cancel-in-progress: false
jobs:
  yield:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 排隊等前一次跑完時，checkout 的是排隊當下的舊版本；先拉到最新的 main，避免和前一次存的資料衝突
      - run: git pull -q origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/etf-yield.mjs
      - name: commit
        run: |
          git config user.name "etf-yield"
          git config user.email "etf-yield@users.noreply.github.com"
          git add learner/data/etf-yield.json
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "ETF：更新殖利率排行"
          for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
