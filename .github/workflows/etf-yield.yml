# ETF 殖利率排行：每個交易日收盤後，用 Yahoo 配息紀錄重算全部台股 ETF 的近 12 個月殖利率（learner/data/etf-yield.json）
name: etf-yield
on:
  schedule:
    - cron: "20 8 * * 1-5"   # 週一到週五台北 16:20
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-sync-etf-yield-${{ github.ref }}
  cancel-in-progress: false
jobs:
  yield:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 357 檔要跑 25～30 分鐘，留餘裕
    steps:
      - uses: actions/checkout@v5
      # 排隊等前一次跑完時，checkout 的是排隊當下的舊版本；先拉到最新的 main，避免和前一次存的資料衝突
      - run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/etf-yield.mjs
        env: # Yahoo 拿不到時改問 FinMind，帶金鑰才不會用匿名額度
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: commit
        if: github.ref == 'refs/heads/main'   # 只有 main 會寫資料；分支上手動跑只看 log
        env:
          COMMIT_NAME: etf-yield
        run: |
          bash scripts/commit-data.sh "ETF：更新殖利率排行" learner/data/etf-yield.json
