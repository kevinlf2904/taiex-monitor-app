# 全市場日 K＋收盤後 Telegram 提醒：每個交易日收盤後更新上市櫃全部股票的日 K（scripts/market-scan.mjs），
# 上傳到 GitHub Release「market-data」給網站的「全市場」選股使用；接著算財報事件回測（scripts/event-study.mjs），
# 再檢查雲端同步使用者的提醒並推播（scripts/alerts-push.mjs）。
name: market-scan
on:
  schedule:
    - cron: "10 8 * * 1-5"   # 週一到週五台北 16:10
    - cron: "40 13 * * 1-5"  # 台北 21:40 再跑一次（證交所全市場資料有時傍晚才更新；提醒依資料日期只送一次）
  workflow_dispatch:
    inputs:
      dry:
        description: "除錯：1＝只更新快取、印統計，不上傳、不推播"
        default: "0"
permissions:
  contents: write
concurrency:
  group: data-sync-market-scan-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 歷史日 K 不進 git，用快取在每次執行之間保留（找不到就從 Yahoo 補一年）
      - uses: actions/cache@v4
        with:
          path: .cache
          key: allk-${{ github.run_id }}
          restore-keys: allk-
      - if: ${{ github.event.inputs.dry == '1' }}
        run: node scripts/market-scan.mjs --dry
      - if: ${{ github.event.inputs.dry != '1' }}
        run: node scripts/market-scan.mjs
      - name: publish
        if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.dry != '1' }}   # 只有 main 會上傳正式資料
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view market-data >/dev/null 2>&1 || gh release create market-data --title "全市場日 K（自動產生）" --notes "由 market-scan 排程每天更新，網站透過 /api/allk 讀取。請勿手動修改。" --latest=false
          gh release upload market-data out/*.json --clobber
      # 財報事件回測（營收創新高、三率三升…之後的報酬）：用剛更新好的全市場日 K 算，寫回 learner/data/event-study.json
      - if: ${{ github.event.inputs.dry != '1' }}
        run: node scripts/event-study.mjs
      - name: commit event study
        if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.dry != '1' }}
        env:
          COMMIT_NAME: event-study
        run: bash scripts/commit-data.sh "財報：更新事件回測" learner/data/event-study.json
      - name: telegram
        if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.dry != '1' }}   # 只有 main 會發真的推播
        continue-on-error: true   # 推播失敗只是警告，不讓全市場資料的排程變成失敗
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/alerts-push.mjs
