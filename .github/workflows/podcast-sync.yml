# 名人 Podcast：每 2 小時自動整理新單集（重點、觀點），結果寫進 learner/data/podcast/index.json 並推回 main，
# Vercel 會自動重新部署，網頁打開就有整理好的內容。
# 建議在 GitHub → Settings → Secrets and variables → Actions 新增 GEMINI_API_KEY（和 Vercel 上的同一把即可），
# 這樣 AI 可以直接聽完整集；沒設時改用已部署網站的 /api/podcast（SITE_URL）。
name: podcast-sync
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-sync-podcast-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      # 排隊等前一次跑完時，checkout 的是排隊當下的舊版本；先拉到最新的 main，避免和前一次存的資料衝突
      - run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --ignore-scripts
      - run: node scripts/podcast-sync.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://kline-school.vercel.app' }}
      - name: commit
        env:
          COMMIT_NAME: podcast-sync
        run: |
          bash scripts/commit-data.sh "名人 Podcast：自動整理新單集" learner/data/podcast
