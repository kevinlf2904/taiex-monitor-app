# 總經數據：每 6 小時從 FRED 更新（台北 6:40、12:40、18:40、0:40；美國數據多在台北晚上 8:30、10:00 公布）（learner/data/macro.json）；FRED 擋雲端主機，網站的 /api/macro 常逾時，所以由排程抓
name: macro
on:
  schedule:
    - cron: "40 4,10,16,22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-sync-macro-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/macro.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: commit
        if: github.ref == 'refs/heads/main'   # 只有 main 會寫資料；分支上手動跑只看 log
        env:
          COMMIT_NAME: macro
        run: |
          bash scripts/commit-data.sh "總經：更新 FRED 數據" learner/data/macro.json
