# 總經數據：每天台北早上 6:40 從 FRED 更新（learner/data/macro.json）；FRED 擋雲端主機，網站的 /api/macro 常逾時，所以由排程抓
name: macro
on:
  schedule:
    - cron: "40 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-sync-macro-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/macro.mjs
      - name: commit
        env:
          COMMIT_NAME: macro
        run: |
          bash scripts/commit-data.sh "總經：更新 FRED 數據" learner/data/macro.json
