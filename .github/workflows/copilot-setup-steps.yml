# GitHub Copilot coding agent 開工前的環境準備：跟 ci.yml 同一版 Node、Playwright 與 chromium，讓它能跑 node tests/run.mjs
# job 名稱必須是 copilot-setup-steps（GitHub 規定）；改了這個檔案時會自動跑一次確認裝得起來
name: copilot-setup-steps
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04 # 跟 ci.yml 一樣：Playwright 1.56 不支援 ubuntu-latest（26.04）
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm i --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
