# 台股內部人持股轉讓事前申報：每個交易日從證交所、櫃買中心 OpenAPI 整理成 learner/data/insider.json
name: insider
on:
  schedule:
    - cron: "45 10 * * 1-5" # 週一到週五台北 18:45
  workflow_dispatch:
    inputs:
      dump:
        description: "除錯：1＝只印出抓到的原始資料、不存檔（0＝正常更新）"
        default: "0"
      year:
        description: "補更早的年份：填年份（例如 2025）就從公開資訊觀測站逐日查那一年的申報，存到 learner/data/insider-arch/；空白＝正常更新"
        default: ""
permissions:
  contents: write
concurrency:
  group: data-sync-insider-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: ${{ github.event.inputs.dump && github.event.inputs.dump != '0' }}
        run: node scripts/insider.mjs --dump
      - if: ${{ (!github.event.inputs.dump || github.event.inputs.dump == '0') && !github.event.inputs.year }}
        run: node scripts/insider.mjs
      - if: ${{ (!github.event.inputs.dump || github.event.inputs.dump == '0') && github.event.inputs.year }}
        env:
          YEAR: ${{ github.event.inputs.year }}
        run: node scripts/insider.mjs --year "$YEAR" --minutes 85
      - name: commit
        if: ${{ github.ref == 'refs/heads/main' && (!github.event.inputs.dump || github.event.inputs.dump == '0') }}
        env:
          COMMIT_NAME: insider
          YEAR: ${{ github.event.inputs.year }}
        run: |
          if [ -n "$YEAR" ]; then bash scripts/commit-data.sh "內部人：補 ${YEAR//[^0-9]/} 年申報" learner/data/insider-arch
          else bash scripts/commit-data.sh "內部人：更新持股轉讓申報" learner/data/insider.json; fi
