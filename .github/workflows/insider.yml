# 台股內部人持股轉讓事前申報：每個交易日從證交所、櫃買中心 OpenAPI 整理成 learner/data/insider.json
name: insider
on:
  schedule:
    - cron: "45 10 * * 1-5" # 週一到週五台北 18:45
  workflow_dispatch:
    inputs:
      dump:
        description: "除錯：1＝只印出抓到的原始資料、不存檔（0＝正常更新）"
        default: "0"
permissions:
  contents: write
concurrency:
  group: insider
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: git pull -q origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: ${{ github.event.inputs.dump && github.event.inputs.dump != '0' }}
        run: node scripts/insider.mjs --dump
      - if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: node scripts/insider.mjs
      - name: commit
        if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: |
          git config user.name "insider"
          git config user.email "insider@users.noreply.github.com"
          git add learner/data/insider.json
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "內部人：更新持股轉讓申報"
          for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
