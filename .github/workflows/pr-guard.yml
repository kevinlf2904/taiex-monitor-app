# PR 狀態看板與風險標籤（#312 PR D）：依 scripts/pr-guard.mjs 判斷，替 PR 貼／拿掉 pr-guard 管理的標籤，並原地更新一則「檢查（pr-guard）」留言
# （最新 head SHA、CI test、風險、大檔衝突、各 AI 留言針對哪個 SHA）。只是提醒，不擋合併，也不是合併門檻（門檻仍是 ci 的 test）。
# 安全：用 pull_request 不用 pull_request_target；fork 來的 PR 不跑（只有同一個 repo 的分支才給寫入權限）；
# 權限只開 pull-requests: write（貼標籤、留言）；不碰密鑰，只用 GITHUB_TOKEN（它的寫入不會再觸發 workflow，不會自己叫自己）。
name: pr-guard
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited] # edited：標題改成「鎖：…」也要重算
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]
  workflow_run: # ci 跑完時更新看板上的 CI 狀態
    workflows: [ci]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: pr-guard-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true # 連續觸發時只留最後一次，看板一樣會是最新狀態
jobs:
  board:
    if: >-
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_review') || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.user.type != 'Bot')) &&
      (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/pr-guard-run.mjs $PR_NUMBERS # 只是 PR 編號（數字），腳本會再過濾
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBERS: ${{ github.event.pull_request.number || github.event.issue.number || join(github.event.workflow_run.pull_requests.*.number, ' ') }}
