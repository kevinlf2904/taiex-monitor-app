# 台指期 1 分 K 存檔（learner/data/fut1m/TXF）：期交所只給目前這一盤的分 K，每盤收盤後存一份，看盤的台指期分 K 才能往前看
name: fut-1m
on:
  schedule:
    - cron: "5 6 * * 1-5"    # 台北 14:05（日盤 13:45 收盤後）
    - cron: "20 21 * * 1-5"  # 台北隔天 05:20（夜盤 05:00 收盤後；週五夜盤在週六清晨收）
  workflow_dispatch:
    inputs:
      dump:
        description: "除錯：1＝只印出抓到的根數、不存檔（0＝正常更新）"
        default: "0"
      backfill:
        description: "補歷史：要補幾個交易日（期交所逐筆成交，最多 30；0＝不補）"
        default: "0"
permissions:
  contents: write
concurrency:
  group: data-sync-fut1m-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Validate inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          INPUT_DUMP: ${{ github.event.inputs.dump }}
          INPUT_BACKFILL: ${{ github.event.inputs.backfill }}
        run: |
          DUMP="${INPUT_DUMP:-0}"
          if [[ "$DUMP" != "0" && "$DUMP" != "1" ]]; then
            echo "::error::Invalid dump input '$DUMP'. Must be 0 or 1."
            exit 1
          fi
          BF="${INPUT_BACKFILL:-0}"
          if ! [[ "$BF" =~ ^[0-9]+$ ]] || [ "$BF" -lt 0 ] || [ "$BF" -gt 30 ]; then
            echo "::error::Invalid backfill input '$BF'. Must be an integer between 0 and 30."
            exit 1
          fi
      - if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - if: ${{ github.event.inputs.dump && github.event.inputs.dump != '0' }}
        run: node scripts/fut-1m.mjs --dump
      - if: ${{ (!github.event.inputs.dump || github.event.inputs.dump == '0') && (!github.event.inputs.backfill || github.event.inputs.backfill == '0') }}
        run: node scripts/fut-1m.mjs
      - if: ${{ github.event.inputs.backfill && github.event.inputs.backfill != '0' }}
        env:
          INPUT_BACKFILL: ${{ github.event.inputs.backfill }}
          INPUT_DUMP: ${{ github.event.inputs.dump }}
        run: |
          BF="0"
          if [[ "$INPUT_BACKFILL" =~ ^[0-9]{1,2}$ ]]; then
            BF="$INPUT_BACKFILL"
          fi
          DUMP_OPT=""
          if [ "$INPUT_DUMP" = "1" ]; then
            DUMP_OPT="--dump"
          fi
          node scripts/fut-1m.mjs --backfill="$BF" $DUMP_OPT
      - name: commit
        if: ${{ github.ref == 'refs/heads/main' && (!github.event.inputs.dump || github.event.inputs.dump == '0') }}
        env:
          COMMIT_NAME: fut-1m
        run: |
          bash scripts/commit-data.sh "台指期：存 1 分 K" learner/data/fut1m
