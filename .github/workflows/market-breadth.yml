# 漲跌家數歷史：每個交易日收盤後補上當天上市、上櫃的漲跌家數（learner/data/market/breadth.json），給 ADR、OBOS、ADL 指標用
name: market-breadth
on:
  schedule:
    - cron: "55 6 * * 1-5"   # 台北 14:55
    - cron: "20 12 * * 1-5"  # 台北 20:20（櫃買資料較晚時補抓）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-breadth
  cancel-in-progress: false
jobs:
  hilo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # 排隊等前一次跑完時，checkout 的是排隊當下的舊版本；先拉到最新的 main，避免和前一次存的資料衝突
      - run: git pull -q origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/market-breadth.mjs
      - name: commit
        run: |
          git config user.name "market-breadth"
          git config user.email "market-breadth@users.noreply.github.com"
          git add learner/data/market
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "大盤：更新漲跌家數歷史"
          for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
