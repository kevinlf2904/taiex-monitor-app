# 美股財報行事曆：每天台北早上 6:23（美股收盤後財報出來）、晚上 9:23（盤前財報出來）從 Nasdaq 更新 learner/data/us-earn.json learner/data/us-earn-hist.json
name: us-earn
on:
  schedule:
    - cron: "23 22 * * *"
    - cron: "23 13 * * *"
  workflow_dispatch:
    inputs:
      back:
        description: "往回抓幾天（補歷史填 400）"
        default: "14"
permissions:
  contents: write
concurrency:
  group: data-sync-us-earn-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/us-earn.mjs
        env: # 營收實際值與預估（Finnhub）；沒設定也能跑，只是沒有營收驚喜
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          BACK: ${{ github.event.inputs.back || 14 }}
      - name: commit
        if: github.ref == 'refs/heads/main'   # 只有 main 會寫資料；分支上手動跑只看 log
        env:
          COMMIT_NAME: us-earn
        run: |
          bash scripts/commit-data.sh "美股財報：更新財報行事曆" learner/data/us-earn.json learner/data/us-earn-hist.json
