# 總經消息：每小時整理一次（美股盤中大漲大跌時，一小時內就看得到原因）
# 抓 Google 新聞的總經標題、分類，有 GEMINI_API_KEY（或網站 /api/chat 可用）時加 AI 摘要，寫進 learner/data/macro-news.json
name: macro-news
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-sync-macro-news-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --ignore-scripts
      - run: node scripts/macro-news.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://kline-school.vercel.app' }}
      - name: commit
        if: github.ref == 'refs/heads/main'   # 只有 main 會寫資料；分支上手動跑只看 log
        env:
          COMMIT_NAME: macro-news
        run: |
          bash scripts/commit-data.sh "總經消息：每日彙整" learner/data/macro-news.json
