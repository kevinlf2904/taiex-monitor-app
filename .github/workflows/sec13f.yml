# 13F 機構持股：每天檢查知名機構有沒有新的 13F 申報（SEC EDGAR），整理成 learner/data/f13.json
name: sec13f
on:
  schedule:
    - cron: "17 0 * * *"   # 每天台北 08:17（美東前一天晚上）
  workflow_dispatch:
    inputs:
      dump:
        description: "除錯：1＝只印出抓到的原始資料、不存檔（0＝正常更新）"
        default: "0"
permissions:
  contents: write
concurrency:
  group: data-sync-sec13f-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - if: ${{ github.event.inputs.dump && github.event.inputs.dump != '0' }}
        run: node scripts/sec13f.mjs --dump
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
      - if: ${{ !github.event.inputs.dump || github.event.inputs.dump == '0' }}
        run: node scripts/sec13f.mjs
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
      - name: data push token
        id: datatoken
        if: ${{ github.ref == 'refs/heads/main' && vars.DATA_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: commit
        if: ${{ github.ref == 'refs/heads/main' && (!github.event.inputs.dump || github.event.inputs.dump == '0') }}
        env:
          COMMIT_NAME: sec13f
          DATA_PUSH_TOKEN: ${{ steps.datatoken.outputs.token }}
        run: |
          bash scripts/commit-data.sh "13F：更新機構持股" learner/data/f13.json learner/data/f13-cusip.json learner/data/f13-hist.json
