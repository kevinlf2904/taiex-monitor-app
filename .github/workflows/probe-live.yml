# 線上網站與外部資料源檢查（除錯用）：只手動執行，結果看 log（原本的盤中排程常延遲到收盤後才跑，看不到盤中狀況，已拿掉）
name: probe-live
on:
  workflow_dispatch:
    inputs:
      n:
        description: "檢查次數"
        default: "12"
      gap:
        description: "間隔秒數"
        default: "10"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --ignore-scripts # yt 模式會載入 api/_lib（要用到套件）
      - run: node scripts/probe-live.mjs ${{ github.event.inputs.n || 12 }} ${{ github.event.inputs.gap || 10 }}
        env: # 只有 keys 模式會用到；只回報「有沒有設定、能不能用」，不印金鑰
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
